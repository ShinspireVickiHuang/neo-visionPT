<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <!-- 頂部 -->
  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <!-- 左側選單（由 sidebar.js 載入共用 partials/sidebar.html） -->
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <!-- 主內容：歡迎畫面 -->
    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">首頁</h2>
      </div>

      <div class="bg-white rounded shadow-sm p-12 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#f5f1ec] mb-5">
          <i data-lucide="layout-dashboard" class="w-8 h-8 text-[#a09080]"></i>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">歡迎使用銷控系統</h3>
        <p class="text-gray-500 mb-8">請從左側選單選擇要使用的功能</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-3xl mx-auto">
          <a href="building-list.html" class="block bg-[#faf8f5] hover:bg-[#f0ebe3] border rounded p-5 transition text-left">
            <div class="flex items-center gap-2 mb-2 text-[#a09080]">
              <i data-lucide="building-2" class="w-5 h-5"></i>
              <span class="font-bold text-gray-800">建案管理</span>
            </div>
            <p class="text-xs text-gray-500">維護建案基本資料</p>
          </a>
          <a href="sales-control.html" class="block bg-[#faf8f5] hover:bg-[#f0ebe3] border rounded p-5 transition text-left">
            <div class="flex items-center gap-2 mb-2 text-[#a09080]">
              <i data-lucide="layout-grid" class="w-5 h-5"></i>
              <span class="font-bold text-gray-800">銷控表</span>
            </div>
            <p class="text-xs text-gray-500">查看與更新銷售狀態</p>
          </a>
          <a href="commission-list.html" class="block bg-[#faf8f5] hover:bg-[#f0ebe3] border rounded p-5 transition text-left">
            <div class="flex items-center gap-2 mb-2 text-[#a09080]">
              <i data-lucide="receipt" class="w-5 h-5"></i>
              <span class="font-bold text-gray-800">佣金管理</span>
            </div>
            <p class="text-xs text-gray-500">佣金清單與報表列印</p>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/sidebar.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
