<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>實價登錄狀況表 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <!-- 頂部 -->
  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <!-- 左側選單 -->
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <!-- 主內容 -->
    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">銷控管理 / 實價登錄狀況表</h2>
        <p class="text-xs text-gray-400 mt-1">彙整所有已成交戶的實價登錄申報進度；應登錄日＝簽約日 +30 天，狀態由系統依日期自動判定</p>
      </div>

      <!-- 搜尋條件 -->
      <div class="bg-white rounded shadow-sm p-6 mb-6">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="text-base font-bold text-gray-700">搜尋條件</h3>
            <p class="text-xs text-gray-400 mt-1">可依建案、客戶、業務員、登錄狀態、簽約日期區間篩選</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="btnExport" class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="download" class="w-4 h-4"></i> 匯出</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-16 flex-shrink-0">建案</label>
            <select id="fProject" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">全部</option>
            </select>
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-16 flex-shrink-0">客戶姓名</label>
            <input id="fCust" type="text" placeholder="請輸入客戶姓名" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-16 flex-shrink-0">業務員</label>
            <input id="fSales" type="text" placeholder="請輸入業務員" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-16 flex-shrink-0">登錄狀態</label>
            <select id="fStatus" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">全部</option>
              <option value="onTime">已登錄（準時）</option>
              <option value="late">已登錄（逾期）</option>
              <option value="overdue">未登錄・已逾期</option>
              <option value="pending">未登錄・期限內</option>
            </select>
          </div>
          <div class="flex items-center gap-3 md:col-span-2">
            <label class="text-sm font-medium w-16 flex-shrink-0">簽約日</label>
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <input id="fSignFrom" type="date" class="border rounded px-2 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 min-w-0">
              <span class="text-gray-400 flex-shrink-0">~</span>
              <input id="fSignTo" type="date" class="border rounded px-2 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 min-w-0">
            </div>
          </div>
          <div class="flex items-center md:col-span-3">
            <label class="flex items-center gap-2 text-sm cursor-pointer select-none whitespace-nowrap">
              <input id="fTodo" type="checkbox" class="rounded"> 僅顯示待辦（未登錄／已逾期）
            </label>
          </div>
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <button id="btnReset" class="flex items-center gap-1 border border-gray-300 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded text-sm"><i data-lucide="eraser" class="w-4 h-4"></i> 清除</button>
          <button id="btnSearch" class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="search" class="w-4 h-4"></i> 搜尋</button>
        </div>
      </div>

      <!-- 查詢結果統計（依建案；按「搜尋」後才顯示） -->
      <div id="statsBlock" class="bg-white rounded shadow-sm p-6 mb-6 hidden">
        <h3 class="text-base font-bold text-gray-700 mb-1">查詢結果統計（依建案）</h3>
        <p class="text-xs text-gray-400 mb-4">依目前搜尋條件統計；點列表可看各戶明細</p>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="table-header-bg text-white">
                <th class="p-3 text-left font-medium whitespace-nowrap">建案</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">成交戶數</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">已登錄（準時）</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">已登錄（逾期）</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">未登錄・已逾期</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">未登錄・期限內</th>
              </tr>
            </thead>
            <tbody id="statsTbody" class="divide-y"></tbody>
          </table>
        </div>
      </div>

      <!-- 列表 -->
      <div class="bg-white rounded shadow-sm">
        <div class="overflow-x-auto p-6">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="table-header-bg text-white">
                <th class="p-3 text-left font-medium whitespace-nowrap">建案</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">棟-戶-樓</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">客戶姓名</th>
                <th class="p-3 text-right font-medium whitespace-nowrap">成交價(萬)</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">業務員</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">簽約日期</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">應登錄日期</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">實際登錄日期</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">實價登錄序號</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">登錄狀態</th>
              </tr>
            </thead>
            <tbody id="tbody" class="divide-y"></tbody>
          </table>
          <div id="emptyHint" class="hidden text-center text-gray-400 py-10 text-sm">查無符合條件的成交戶</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    // ============================================================
    // 範例成交戶資料（之後改為從 API 帶入）
    // 只存原始欄位；應登錄日期與登錄狀態由程式自動計算
    // ============================================================
    const DEALS = [
      { project:'畫世代', unit:'A棟-2-15F', cust:'陳太太', price:3000, sales:'徐X恩', signDate:'2026-04-08', actualDate:'2026-05-06', serial:'112A-預售-000123' },
      { project:'畫世代', unit:'A棟-1-10F', cust:'林先生', price:2800, sales:'王小明', signDate:'2026-05-20', actualDate:'2026-06-25', serial:'112A-預售-000188' },
      { project:'TheTop', unit:'B棟-1-8F',  cust:'黃小姐', price:3500, sales:'李美華', signDate:'2026-05-10', actualDate:'',           serial:'' },
      { project:'新希望', unit:'A棟-3-12F', cust:'張先生', price:4200, sales:'徐X恩', signDate:'2026-06-25', actualDate:'',           serial:'' },
      { project:'畫世代', unit:'B棟-2-5F',  cust:'吳太太', price:2600, sales:'王小明', signDate:'2026-06-30', actualDate:'',           serial:'' },
      { project:'TheTop', unit:'A棟-4-6F',  cust:'蔡先生', price:3100, sales:'李美華', signDate:'2026-06-01', actualDate:'2026-07-01', serial:'112T-預售-000210' },
      { project:'新希望', unit:'C棟-2-3F',  cust:'鄭先生', price:2400, sales:'周大寶', signDate:'2026-05-25', actualDate:'',           serial:'' },
    ];

    // 申報期限：簽約日 +30 天（實價登錄2.0 預售屋規定）
    const DECLARE_DAYS = 30;

    const pad = n => String(n).padStart(2, '0');
    const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    // 由簽約日算應登錄日
    function calcDueDate(signDate) {
      if (!signDate) return '';
      const d = new Date(signDate + 'T00:00:00');
      d.setDate(d.getDate() + DECLARE_DAYS);
      return fmt(d);
    }

    // 判定登錄狀態
    // onTime 已登錄準時 / late 已登錄逾期 / overdue 未登錄已逾期 / pending 未登錄期限內
    function calcStatus(deal) {
      const due = calcDueDate(deal.signDate);
      const today = fmt(new Date());
      if (deal.actualDate) {
        return deal.actualDate <= due ? 'onTime' : 'late';
      }
      return today > due ? 'overdue' : 'pending';
    }

    const STATUS_META = {
      onTime:  { text:'已登錄（準時）', cls:'bg-green-100 text-green-700 border border-green-300' },
      late:    { text:'已登錄（逾期）', cls:'bg-orange-100 text-orange-700 border border-orange-300' },
      overdue: { text:'未登錄・已逾期', cls:'bg-red-100 text-red-700 border border-red-300' },
      pending: { text:'未登錄・期限內', cls:'bg-gray-100 text-gray-600 border border-gray-300' },
    };

    // 建案下拉選單
    (function fillProjects(){
      const sel = document.getElementById('fProject');
      [...new Set(DEALS.map(d => d.project))].forEach(p => {
        const o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o);
      });
    })();

    // 依搜尋條件過濾
    function getFiltered() {
      const project = document.getElementById('fProject').value;
      const cust    = document.getElementById('fCust').value.trim();
      const sales   = document.getElementById('fSales').value.trim();
      const status  = document.getElementById('fStatus').value;
      const from    = document.getElementById('fSignFrom').value;
      const to      = document.getElementById('fSignTo').value;
      const todoOnly= document.getElementById('fTodo').checked;

      return DEALS.filter(d => {
        const st = calcStatus(d);
        if (project && d.project !== project) return false;
        if (cust && !d.cust.includes(cust)) return false;
        if (sales && !d.sales.includes(sales)) return false;
        if (status && st !== status) return false;
        if (from && d.signDate < from) return false;
        if (to && d.signDate > to) return false;
        if (todoOnly && !(st === 'overdue' || st === 'pending')) return false;
        return true;
      });
    }

    // 渲染列表 + 統計
    function render() {
      const rows = getFiltered();
      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('emptyHint');
      tbody.innerHTML = '';

      rows.forEach((d, i) => {
        const st = calcStatus(d);
        const meta = STATUS_META[st];
        const tr = document.createElement('tr');
        tr.className = i % 2 ? 'bg-gray-50 hover:bg-gray-100' : 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-3 align-top whitespace-nowrap">${d.project}</td>
          <td class="p-3 align-top whitespace-nowrap">${d.unit}</td>
          <td class="p-3 align-top whitespace-nowrap">${d.cust}</td>
          <td class="p-3 align-top text-right whitespace-nowrap">${d.price.toLocaleString()}</td>
          <td class="p-3 align-top whitespace-nowrap">${d.sales}</td>
          <td class="p-3 align-top whitespace-nowrap">${d.signDate || '—'}</td>
          <td class="p-3 align-top whitespace-nowrap">${calcDueDate(d.signDate) || '—'}</td>
          <td class="p-3 align-top whitespace-nowrap">${d.actualDate || '—'}</td>
          <td class="p-3 align-top whitespace-nowrap">${d.serial || '—'}</td>
          <td class="p-3 align-top text-center whitespace-nowrap">
            <span class="inline-block px-2 py-1 rounded text-xs ${meta.cls}">${meta.text}</span>
          </td>`;
        tbody.appendChild(tr);
      });

      empty.classList.toggle('hidden', rows.length !== 0);

      // 查詢結果統計（依建案分組；以目前搜尋結果為基礎）
      renderStats(rows);
    }

    // 依建案分組的統計表
    function renderStats(rows) {
      const tbody = document.getElementById('statsTbody');
      tbody.innerHTML = '';

      const byProject = {};
      rows.forEach(d => {
        const p = byProject[d.project] ||= { total:0, onTime:0, late:0, overdue:0, pending:0 };
        p.total++;
        p[calcStatus(d)]++;
      });

      const cell = (v, colorCls) => `<td class="p-3 text-center ${v ? colorCls : 'text-gray-300'}">${v}</td>`;
      const sum = { total:0, onTime:0, late:0, overdue:0, pending:0 };

      Object.entries(byProject).forEach(([name, c], i) => {
        Object.keys(sum).forEach(k => sum[k] += c[k]);
        const tr = document.createElement('tr');
        tr.className = i % 2 ? 'bg-gray-50' : '';
        tr.innerHTML = `
          <td class="p-3 whitespace-nowrap">${name}</td>
          ${cell(c.total, 'font-bold text-gray-800')}
          ${cell(c.onTime, 'font-bold text-green-600')}
          ${cell(c.late, 'font-bold text-orange-500')}
          ${cell(c.overdue, 'font-bold text-red-600')}
          ${cell(c.pending, 'font-bold text-gray-600')}`;
        tbody.appendChild(tr);
      });

      // 總計列
      if (Object.keys(byProject).length) {
        const tr = document.createElement('tr');
        tr.className = 'bg-gray-100 border-t-2 border-gray-300';
        tr.innerHTML = `
          <td class="p-3 font-bold whitespace-nowrap">總計</td>
          ${cell(sum.total, 'font-bold text-gray-800')}
          ${cell(sum.onTime, 'font-bold text-green-600')}
          ${cell(sum.late, 'font-bold text-orange-500')}
          ${cell(sum.overdue, 'font-bold text-red-600')}
          ${cell(sum.pending, 'font-bold text-gray-600')}`;
        tbody.appendChild(tr);
      } else {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">查無符合條件的成交戶</td></tr>';
      }
    }

    // 統計區塊：按「搜尋」後才顯示；「清除」時收回
    document.getElementById('btnSearch').onclick = () => {
      document.getElementById('statsBlock').classList.remove('hidden');
      render();
    };
    document.getElementById('btnReset').onclick = () => {
      ['fProject','fCust','fSales','fStatus','fSignFrom','fSignTo'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fTodo').checked = false;
      document.getElementById('statsBlock').classList.add('hidden');
      render();
    };
    document.getElementById('btnExport').onclick = () => alert('匯出（範例）');
    // 即時篩選：輸入/選擇就更新
    ['fProject','fCust','fSales','fStatus','fSignFrom','fSignTo'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
    });
    document.getElementById('fTodo').addEventListener('change', render);

    render();
  </script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
