<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>媒體執行總表 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">媒體執行總表(來人暨成交平均媒體花費)</h2>
      </div>

      <!-- 搜尋條件 -->
      <div class="bg-white rounded shadow-sm p-6 mb-6">
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-10 flex-shrink-0">建案</label>
            <input id="srchBldg" type="text" placeholder="請輸入建案名稱"
              class="border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-56">
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-10 flex-shrink-0">年度</label>
            <select id="srchYear" class="border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-32">
              <option value="">請選擇</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
            </select>
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm font-medium w-10 flex-shrink-0">週期</label>
            <select id="srchPeriod" class="border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-40">
              <option value="">請選擇</option>
              <option value="0107">0107</option>
              <option value="zz">zz</option>
              <option value="aa">aa</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button class="flex items-center gap-1 bg-[#5d6b7b] hover:bg-[#4a5563] text-white px-4 py-2 rounded text-sm">
            <i data-lucide="search" class="w-4 h-4"></i> 查詢
          </button>
          <button id="btnNew" class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm">
            <i data-lucide="plus" class="w-4 h-4"></i> 新增
          </button>
        </div>
      </div>

      <!-- 列表 -->
      <div class="bg-white rounded shadow-sm">
        <div class="overflow-x-auto p-6">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="table-header-bg text-white">
                <th class="p-3 text-left font-medium whitespace-nowrap">建案</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">年度</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">週期</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">日期(起)</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">日期(迄)</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">建立時間</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">異動時間</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <tr class="hover:bg-gray-50" data-row-key="畫世代_2026_0107">
                <td class="p-3">畫世代</td>
                <td class="p-3">2026</td>
                <td class="p-3">0107</td>
                <td class="p-3">2026-01-07</td>
                <td class="p-3">2026-01-12</td>
                <td class="p-3 whitespace-nowrap">2026-01-07 01:46:59</td>
                <td class="p-3 whitespace-nowrap">2026-05-05 02:05:10</td>
                <td class="p-3">
                  <div class="flex flex-wrap gap-1 justify-center">
                    <a href="weekly-report-step2.html?mode=edit&building=畫世代&year=2026&month=01&period=0107"
                       data-base-href="weekly-report-step2.html?mode=edit&building=畫世代&year=2026&month=01&period=0107"
                       class="edit-btn border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="edit-3" class="w-3 h-3"></i> 編輯</a>
                    <button class="border border-red-300 text-red-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-red-50"><i data-lucide="trash-2" class="w-3 h-3"></i> 刪除</button>
                    <a href="media-cost-monthly.html?building=畫世代&year=2026&month=01&w1=0107" class="border border-gray-300 text-gray-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="file-bar-chart" class="w-3 h-3"></i> 查看月媒體執行總表</a>
                    <button class="freeze-btn border border-orange-300 text-orange-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-orange-50"><i data-lucide="lock" class="w-3 h-3"></i> 凍結資料</button>
                  </div>
                </td>
              </tr>
              <tr class="bg-gray-50 hover:bg-gray-100" data-row-key="畫世代_2023_zz">
                <td class="p-3">畫世代</td>
                <td class="p-3">2023</td>
                <td class="p-3">zz</td>
                <td class="p-3">2023-11-09</td>
                <td class="p-3">2023-11-10</td>
                <td class="p-3 whitespace-nowrap">2023-11-10 03:12:39</td>
                <td class="p-3 whitespace-nowrap">2026-05-05 06:11:22</td>
                <td class="p-3">
                  <div class="flex flex-wrap gap-1 justify-center">
                    <a href="weekly-report-step2.html?mode=edit&building=畫世代&year=2023&month=11&period=zz"
                       data-base-href="weekly-report-step2.html?mode=edit&building=畫世代&year=2023&month=11&period=zz"
                       class="edit-btn border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="edit-3" class="w-3 h-3"></i> 編輯</a>
                    <button class="border border-red-300 text-red-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-red-50"><i data-lucide="trash-2" class="w-3 h-3"></i> 刪除</button>
                    <a href="media-cost-monthly.html?building=畫世代&year=2023&month=11&w1=zz" class="border border-gray-300 text-gray-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="file-bar-chart" class="w-3 h-3"></i> 查看月媒體執行總表</a>
                    <button class="freeze-btn border border-orange-300 text-orange-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-orange-50"><i data-lucide="lock" class="w-3 h-3"></i> 凍結資料</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 分頁 -->
        <div class="flex justify-center items-center gap-1 py-4 border-t">
          <button class="px-2 py-1 rounded text-sm text-gray-500 hover:bg-gray-100 disabled:opacity-40" disabled>«</button>
          <button class="px-2 py-1 rounded text-sm text-gray-500 hover:bg-gray-100 disabled:opacity-40" disabled>‹</button>
          <button class="px-3 py-1 rounded text-sm bg-[#a09080] text-white font-semibold">1</button>
          <button class="px-2 py-1 rounded text-sm text-gray-500 hover:bg-gray-100 disabled:opacity-40" disabled>›</button>
          <button class="px-2 py-1 rounded text-sm text-gray-500 hover:bg-gray-100 disabled:opacity-40" disabled>»</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // 自動帶入最新年度與週期
    document.getElementById('srchYear').value = '2026';
    document.getElementById('srchPeriod').value = '0107';

    // 新增：將搜尋條件帶入 step2
    document.getElementById('btnNew').addEventListener('click', function () {
      const p = new URLSearchParams({
        mode: 'new',
        building: document.getElementById('srchBldg').value,
        year: document.getElementById('srchYear').value,
        period: document.getElementById('srchPeriod').value
      });
      location.href = 'weekly-report-step2.html?' + p;
    });

    // 凍結後將編輯改為檢視（帶 frozen=1）、凍結按鈕變已凍結
    function applyFrozen(tr) {
      const editBtn = tr.querySelector('.edit-btn');
      editBtn.href = editBtn.dataset.baseHref + '&frozen=1';
      editBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 檢視';
      const freezeBtn = tr.querySelector('.freeze-btn');
      freezeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 已凍結';
      freezeBtn.disabled = true;
      freezeBtn.className = 'freeze-btn border border-gray-200 text-gray-400 px-2 py-1 rounded text-xs flex items-center gap-1 cursor-not-allowed bg-gray-50';
    }

    // 頁面載入時恢復凍結狀態
    document.querySelectorAll('[data-row-key]').forEach(tr => {
      if (localStorage.getItem('frozen_' + tr.dataset.rowKey)) applyFrozen(tr);
    });

    // 點擊凍結按鈕
    document.querySelectorAll('.freeze-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const tr = this.closest('[data-row-key]');
        if (confirm('凍結後將無法再編輯此筆資料，確定要凍結嗎？')) {
          localStorage.setItem('frozen_' + tr.dataset.rowKey, '1');
          applyFrozen(tr);
        }
      });
    });
  </script>
  <script>lucide.createIcons();</script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
