  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('mode') === 'edit') {
      document.getElementById('pageMode').textContent = p.get('frozen') === '1' ? '檢視' : '編輯';
    }
    // 新增 & 編輯都預填 URL 帶入的值
    if (p.get('building')) document.getElementById('infoBldg').value   = p.get('building');
    if (p.get('year'))     document.getElementById('infoYear').value   = p.get('year');
    if (p.get('month'))    document.getElementById('infoMonth').value  = p.get('month');
    if (p.get('period'))   document.getElementById('infoPeriod').value = p.get('period');

    // 凍結模式：停用所有欄位，隱藏確定按鈕
    if (p.get('frozen') === '1') {
      document.querySelectorAll('input, select, textarea').forEach(el => {
        el.disabled = true;
        el.classList.add('opacity-70', 'cursor-not-allowed');
      });
      // 插入凍結提示列
      const banner = document.createElement('div');
      banner.className = 'bg-orange-50 border border-orange-200 text-orange-700 text-sm px-4 py-2 rounded mb-4 max-w-3xl mx-auto flex items-center gap-2';
      banner.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 此資料已凍結，僅供檢視，無法修改。';
      document.querySelector('main').insertBefore(banner, document.querySelector('.bg-white.rounded.shadow-sm.max-w-3xl'));
      // 隱藏確定按鈕，保留返回
      document.querySelectorAll('.flex.justify-center.gap-3 a').forEach((a, i) => {
        if (i === 1) a.style.display = 'none'; // 確定
        else a.textContent = '返回';
      });
    }
  </script>
  <script>lucide.createIcons();</script>
  <script src="assets/js/sidebar.js"></script>
