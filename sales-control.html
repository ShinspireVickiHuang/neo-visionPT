<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>銷控表 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* 圖例圓圈 */
    .dot { display:inline-block; width:18px; height:18px; border-radius:50%; vertical-align:middle; }
    .dot-sale  { border:2px solid #374151; background:#fff; }
    .dot-full  { border:2px solid #374151; background:#fff; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #374151; }
    .dot-sign  { background:#374151; }

    /* 銷控格 */
    .cell {
      height: 56px;
      border:1px solid #d1d5db;
      position:relative;
      cursor:pointer;
      transition:background 0.15s;
    }
    .cell:hover { background:#fef3c7; }
    .cell-sold     { background:#e5e7eb; }
    .cell-reserved { background:#f3f4f6; }
    .cell-mark {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%, -50%);
    }
  </style>
</head>
<body class="content-bg font-sans text-gray-700">

  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">銷控管理 / 銷控表</h2>
      </div>

      <!-- 搜尋條件 -->
      <div class="bg-white rounded shadow-sm p-6 mb-6">
        <div class="space-y-4">
          <!-- 建案 -->
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-20">建案</label>
            <select class="border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-80">
              <option>畫世代</option>
              <option>TheTop</option>
              <option>新希望</option>
            </select>
          </div>

          <!-- 時間 -->
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-20">時間</label>
            <input type="date" placeholder="開始日期" class="border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-44">
            <input type="date" placeholder="結束日期" class="border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-44">
          </div>

          <!-- 顯示 checkbox -->
          <div class="flex items-start gap-4">
            <label class="text-sm font-medium w-20 pt-1">顯示</label>
            <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm">
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">全選</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">客戶姓名</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">銷售日期</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">補足日期</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">簽約日期</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">坪數</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">車位</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">業務員</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">補足逾期</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">簽約逾期</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">總售價(萬)</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">備註</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">保留原因</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">房單價</label>
              <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="rounded">特殊戶</label>
            </div>
          </div>
        </div>

        <!-- 動作按鈕 -->
        <div class="flex flex-wrap justify-end gap-2 mt-6">
          <button class="flex items-center gap-1 bg-[#5d6b7b] hover:bg-[#4a5563] text-white px-4 py-2 rounded text-sm"><i data-lucide="search" class="w-4 h-4"></i> 查詢</button>
          <button class="flex items-center gap-1 bg-[#5d6b7b] hover:bg-[#4a5563] text-white px-4 py-2 rounded text-sm"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> 重置</button>
          <button class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="download" class="w-4 h-4"></i> 匯出現有資料</button>
          <button class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="upload" class="w-4 h-4"></i> 批次新增匯入房屋</button>
          <button class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="upload" class="w-4 h-4"></i> 批次新增匯入車位</button>
        </div>
        <div class="flex flex-wrap justify-end gap-2 mt-2">
          <button class="flex items-center gap-1 border border-gray-300 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded text-sm"><i data-lucide="download" class="w-4 h-4"></i> 下載房屋範本</button>
          <button class="flex items-center gap-1 border border-gray-300 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded text-sm"><i data-lucide="download" class="w-4 h-4"></i> 下載車位範本</button>
        </div>
      </div>

      <!-- 圖例 + 統計 -->
      <div class="bg-white rounded shadow-sm p-6 mb-4 flex items-center gap-6 text-sm">
        <div class="flex items-center gap-2"><span class="dot dot-sale"></span><span>售</span></div>
        <div class="flex items-center gap-2"><span class="dot dot-full"></span><span>足</span></div>
        <div class="flex items-center gap-2"><span class="dot dot-sign"></span><span>簽</span></div>
        <div class="text-gray-500">售 <b class="text-gray-800">2</b></div>
        <div class="text-gray-500">足 <b class="text-gray-800">1</b></div>
        <div class="text-gray-500">簽 <b class="text-gray-800">3</b></div>
      </div>

      <!-- A 棟銷控表 -->
      <div class="bg-white rounded shadow-sm p-6 mb-6">
        <h3 class="text-base font-bold text-gray-700 mb-3">A棟</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm" id="blockA">
            <thead>
              <tr class="bg-gray-100">
                <th class="border p-3 font-medium w-32">樓層 \ 戶別</th>
                <th class="border p-3 font-medium">A棟-1</th>
                <th class="border p-3 font-medium">A棟-2</th>
                <th class="border p-3 font-medium">A棟-3</th>
                <th class="border p-3 font-medium">A棟-4</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- B 棟（範例：另一棟） -->
      <div class="bg-white rounded shadow-sm p-6">
        <h3 class="text-base font-bold text-gray-700 mb-3">B棟</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm" id="blockB">
            <thead>
              <tr class="bg-gray-100">
                <th class="border p-3 font-medium w-32">樓層 \ 戶別</th>
                <th class="border p-3 font-medium">B棟-1</th>
                <th class="border p-3 font-medium">B棟-2</th>
                <th class="border p-3 font-medium">B棟-3</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    // 產生樓層 × 戶別格子
    function buildBlock(tbodyId, blockName, units, floors, marks) {
      const tbody = document.querySelector('#' + tbodyId.parent + ' tbody');
      for (let f = floors; f >= 1; f--) {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.className = 'border p-3 bg-gray-50 font-medium';
        th.textContent = f;
        tr.appendChild(th);
        for (let u = 1; u <= units; u++) {
          const td = document.createElement('td');
          td.className = 'cell';
          const key = `${f}-${u}`;
          const m = marks[key];
          if (m === 'sold') td.classList.add('cell-sold');
          else if (m === 'reserved') td.classList.add('cell-reserved');
          else if (m === 'sale')  td.innerHTML = '<span class="cell-mark dot dot-sale"></span>';
          else if (m === 'full')  td.innerHTML = '<span class="cell-mark dot dot-full"></span>';
          else if (m === 'sign')  td.innerHTML = '<span class="cell-mark dot dot-sign"></span>';
          // 點擊格子 → 開戶別編輯彈窗
          td.onclick = () => showHouseEditModal(blockName, u, f);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    // ============================================================
    // 戶別編輯彈窗
    // ============================================================
    function showHouseEditModal(block, unit, floor) {
      const old = document.getElementById('__houseModal__');
      if (old) old.remove();

      const modal = document.createElement('div');
      modal.id = '__houseModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";

      const inputStyle = "width:100%;border:1px solid #d1d5db;border-radius:4px;padding:8px 12px;font-size:14px;background:#f9fafb;box-sizing:border-box;";
      const fieldRow = (label, control, required = false) => `
        <div style="display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;padding:6px 0;">
          <label style="font-size:14px;color:#374151;">${label}${required ? ' <span style="color:#ef4444;">*</span>' : ''}</label>
          <div style="font-size:14px;">${control}</div>
        </div>`;

      // 範例資料（之後可改為從 API 帶入）
      const sample = {
        custCode: '4411',
        custName: '陳太太',
        price: 3000,
        sales: '徐X恩',
        defaultCommissionRate: 6,   // 建案管理設定的可請佣金 %
        commissionRate: 6,          // 本戶實際使用的 %（預設同建案）
        commissionReason: '',       // 異動原因
        parking: [
          { id: 'P-001', no: 'B1-15', status: '使用中' }
        ]
      };

      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:780px;box-shadow:0 20px 50px rgba(0,0,0,0.25);">
          <!-- 標題列 -->
          <div style="padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:bold;font-size:16px;color:#374151;">編輯</span>
            <button id="__delBtn__" title="刪除此戶資料" style="background:#ef4444;color:#fff;border:0;width:36px;height:36px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
            </button>
          </div>

          <!-- 副標：戶別資訊 -->
          <div style="padding:14px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e5e7eb;">
            <span style="font-weight:bold;font-size:18px;color:#1f2937;">${block}-${unit}-${floor}F</span>
            <span style="color:#6b7280;font-size:14px;">75坪</span>
            <button title="重新整理" style="background:#9ca3af;color:#fff;border:0;width:30px;height:30px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
          </div>

          <!-- 表單區 -->
          <div style="padding:18px 24px;display:flex;flex-direction:column;gap:6px;">
            ${fieldRow("保留戶", `<label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox"> 是</label>`)}
            ${fieldRow("客資編號", `
              <div style="display:flex;gap:8px;">
                <input type="text" value="${sample.custCode}" style="${inputStyle}">
                <button style="background:#a09080;color:#fff;border:0;width:38px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
              </div>`, true)}
            ${fieldRow("客戶姓名", `<input type="text" value="${sample.custName}" style="${inputStyle}">`)}
            ${fieldRow("客戶年齡", `<input type="text" placeholder="客戶年齡" style="${inputStyle}">`)}
            ${fieldRow("身分證", `<input type="text" placeholder="身分證" style="${inputStyle}">`)}
            ${fieldRow("生日", `<input type="text" placeholder="請輸入生日" style="${inputStyle}">`)}
            ${fieldRow("房屋成交價格", `
              <div style="position:relative;">
                <input type="number" value="${sample.price}" style="${inputStyle};padding-right:50px;">
                <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6b7280;font-size:12px;">萬元</span>
              </div>`, true)}
            ${fieldRow("可請佣金(%)", `
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <input type="number" id="__commissionInput__" value="${sample.commissionRate}" min="0" max="100" step="0.01" style="${inputStyle};max-width:120px;">
                  <span style="color:#6b7280;font-size:13px;">%</span>
                  <span style="color:#9ca3af;font-size:12px;">（建案預設 ${sample.defaultCommissionRate}%）</span>
                  <span style="color:#3b82f6;font-size:11px;">⓵ 此 % 將連動至「佣金收入計算」</span>
                </div>
                <div id="__commissionReasonBox__" style="display:none;margin-top:10px;">
                  <div style="font-size:12px;color:#ef4444;margin-bottom:4px;">※ 已異動建案預設值，請選擇折佣類型 <span style="color:#9ca3af;">（必填）</span></div>
                  <select id="__commissionType__" style="${inputStyle}">
                    <option value="">請選擇折佣類型</option>
                    <option>關係戶</option>
                    <option>折佣戶</option>
                  </select>
                  <div style="font-size:12px;color:#6b7280;margin:10px 0 4px;">備註 <span style="color:#9ca3af;">（非必填）</span></div>
                  <textarea id="__commissionReason__" rows="2" placeholder="可選填說明（例如：客戶議價、主管特批等）" style="${inputStyle};resize:vertical;font-family:inherit;"></textarea>
                </div>
                <div id="__commissionNoteDisplay__" style="display:none;margin-top:8px;background:#fef3c7;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:4px;font-size:12px;color:#78350f;line-height:1.7;">
                  <b>※ 本戶可請佣金已異動為 <span id="__commissionNoteRate__"></span>%（建案原為 ${sample.defaultCommissionRate}%）</b><br>
                  折佣類型：<b><span id="__commissionNoteType__"></span></b><br>
                  備註：<span id="__commissionNoteText__"></span>
                </div>
              </div>`)}
            ${fieldRow("業務員", `
              <div style="display:flex;gap:8px;">
                <input type="text" value="${sample.sales}" style="${inputStyle}">
                <button style="background:#a09080;color:#fff;border:0;width:38px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
              </div>`, true)}
          </div>

          <!-- 車位管理區塊 -->
          <div style="margin:0 24px 18px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;">
            <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#f9fafb;border-bottom:1px solid #e5e7eb;">
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:#3b82f6;color:#fff;border-radius:4px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                </span>
                <span style="font-weight:bold;color:#374151;">車位管理</span>
                <span style="font-size:12px;color:#6b7280;">（管理所有購買及退訂的車位）</span>
              </div>
              <button style="background:#a09080;color:#fff;border:0;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;">
                + 新增車位
              </button>
            </div>
            <div style="padding:12px 16px;">
              <div style="display:flex;gap:8px;margin-bottom:10px;">
                <span style="background:#10b981;color:#fff;font-size:12px;padding:3px 10px;border-radius:4px;">使用中: ${sample.parking.length}</span>
                <span style="background:#9ca3af;color:#fff;font-size:12px;padding:3px 10px;border-radius:4px;">已退訂: 0</span>
              </div>
              <!-- 車位卡片：使用中（含完整欄位） -->
              <div style="border:2px solid #10b981;border-radius:6px;padding:14px;background:#fff;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                  <span style="background:#10b981;color:#fff;font-size:13px;padding:5px 12px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    使用中
                  </span>
                  <button style="background:#fff;border:1.5px solid #ef4444;color:#ef4444;width:34px;height:30px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path></svg>
                  </button>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                  <div>
                    <label style="font-size:13px;color:#374151;display:block;margin-bottom:4px;">車位編號 <span style="color:#ef4444;">*</span></label>
                    <select style="${inputStyle}"><option>B1-6</option><option>B1-7</option><option>B1-8</option></select>
                  </div>
                  <div>
                    <label style="font-size:13px;color:#374151;display:block;margin-bottom:4px;">車位價格 <span style="color:#ef4444;">*</span></label>
                    <div style="position:relative;">
                      <input type="number" value="280" style="${inputStyle};padding-right:50px;">
                      <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6b7280;font-size:12px;">萬元</span>
                    </div>
                  </div>
                </div>
                <div style="margin-top:10px;">
                  <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="checkbox"> 加購</label>
                </div>
                <div style="margin-top:14px;">
                  <label style="font-size:13px;color:#374151;display:block;margin-bottom:4px;">退訂日期</label>
                  <div style="display:flex;gap:8px;align-items:center;">
                    <input type="date" placeholder="選擇退訂日期" style="${inputStyle};flex:1;">
                    <button style="background:#f59e0b;color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                      辦理退訂
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 介紹人 -->
          <div style="padding:0 24px 18px;display:flex;align-items:center;gap:10px;">
            <span style="font-weight:bold;color:#374151;font-size:14px;">介紹人</span>
            <button style="background:#a09080;color:#fff;border:0;width:36px;height:32px;border-radius:4px;cursor:pointer;font-size:18px;line-height:1;">+</button>
          </div>

          <!-- 狀態 -->
          <div style="padding:0 24px 18px;border-top:1px solid #e5e7eb;padding-top:18px;margin:0 24px;">
            <h3 style="font-weight:bold;font-size:16px;color:#374151;margin:0 0 14px;">狀態</h3>

            <!-- 銷售 -->
            <div style="margin-bottom:18px;">
              <div style="font-weight:bold;font-size:14px;color:#374151;">銷售 <span style="color:#ef4444;">*</span></div>
              <div style="font-size:12px;color:#ef4444;margin-bottom:6px;">備註限制1000字</div>
              <input type="date" value="2026-04-08" style="${inputStyle};margin-bottom:8px;">
              <textarea rows="3" maxlength="1000" placeholder="備註" style="${inputStyle};resize:vertical;font-family:inherit;"></textarea>
            </div>

            <!-- 補足 -->
            <div style="margin-bottom:18px;">
              <div style="font-weight:bold;font-size:14px;color:#374151;">補足</div>
              <div style="font-size:12px;color:#ef4444;margin-bottom:6px;">備註限制1000字</div>
              <input type="date" placeholder="補足日期" style="${inputStyle};margin-bottom:8px;">
              <textarea rows="3" maxlength="1000" placeholder="備註" style="${inputStyle};resize:vertical;font-family:inherit;"></textarea>
            </div>

            <!-- 簽約 -->
            <div style="margin-bottom:18px;">
              <div style="font-weight:bold;font-size:14px;color:#374151;">簽約</div>
              <div style="font-size:12px;color:#ef4444;margin-bottom:6px;">備註限制1000字</div>
              <input type="date" placeholder="簽約日期" style="${inputStyle};margin-bottom:8px;">
              <textarea rows="3" maxlength="1000" placeholder="備註" style="${inputStyle};resize:vertical;font-family:inherit;"></textarea>
            </div>

            <!-- 退戶 -->
            <div style="margin-bottom:14px;">
              <div style="font-weight:bold;font-size:14px;color:#374151;margin-bottom:6px;">退戶</div>
              <input type="date" placeholder="退戶日期" style="${inputStyle};">
            </div>
            <div>
              <div style="font-weight:bold;font-size:14px;color:#374151;margin-bottom:6px;">退戶因素</div>
              <select style="${inputStyle};color:#9ca3af;">
                <option value="">請選擇</option>
                <option style="color:#374151;">客戶反悔</option>
                <option style="color:#374151;">財務問題</option>
                <option style="color:#374151;">家庭因素</option>
                <option style="color:#374151;">其他</option>
              </select>
            </div>
          </div>

          <!-- 底部按鈕 -->
          <div style="padding:14px 24px 20px;display:flex;justify-content:center;gap:10px;border-top:1px solid #e5e7eb;background:#fafafa;">
            <button id="__houseCancelBtn__" style="background:#fff;color:#374151;border:1px solid #d1d5db;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">取消</button>
            <button id="__houseConfirmBtn__" style="background:#a09080;color:#fff;border:0;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">確定</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      const close = () => modal.remove();
      modal.querySelector('#__houseCancelBtn__').onclick = close;
      modal.querySelector('#__houseConfirmBtn__').onclick = () => { alert('已儲存（範例）'); close(); };
      modal.querySelector('#__delBtn__').onclick = () => {
        if (confirm(`確定要刪除 ${block}-${unit}-${floor}F 的資料嗎？`)) close();
      };
      modal.addEventListener('click', e => { if (e.target === modal) close(); });

      // 可請佣金 % 異動偵測
      const commInput   = modal.querySelector('#__commissionInput__');
      const reasonBox   = modal.querySelector('#__commissionReasonBox__');
      const typeSelect  = modal.querySelector('#__commissionType__');
      const reasonInput = modal.querySelector('#__commissionReason__');
      const noteDisplay = modal.querySelector('#__commissionNoteDisplay__');
      const noteText    = modal.querySelector('#__commissionNoteText__');
      const noteRate    = modal.querySelector('#__commissionNoteRate__');
      const noteType    = modal.querySelector('#__commissionNoteType__');
      const defaultRate = sample.defaultCommissionRate;

      const updateCommissionUI = () => {
        const changed = Number(commInput.value) !== defaultRate;
        reasonBox.style.display = changed ? 'block' : 'none';
        // 折佣類型必填；備註選填
        if (changed && typeSelect.value) {
          noteRate.textContent = commInput.value;
          noteType.textContent = typeSelect.value;
          noteText.textContent = reasonInput.value.trim() || '（無）';
          noteDisplay.style.display = 'block';
        } else {
          noteDisplay.style.display = 'none';
        }
      };
      commInput.addEventListener('input', updateCommissionUI);
      typeSelect.addEventListener('change', updateCommissionUI);
      reasonInput.addEventListener('input', updateCommissionUI);
    }

    // A 棟：15 樓 × 4 戶；幾個範例標記
    buildBlock({ parent: 'blockA' }, 'A棟', 4, 15, {
      '15-1': 'sold',
      '13-2': 'reserved',
      '12-3': 'sale',
      '10-1': 'sign',
      '8-4':  'full',
      '6-2':  'sign',
      '4-3':  'sale',
      '2-1':  'sign'
    });

    // B 棟：12 樓 × 3 戶
    buildBlock({ parent: 'blockB' }, 'B棟', 3, 12, {
      '12-1': 'sold',
      '10-2': 'sign',
      '7-3':  'sale',
      '5-1':  'full'
    });
  </script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
