<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>建案管理 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <!-- 頂部 -->
  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <!-- 左側選單 -->
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <!-- 主內容 -->
    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">建案管理 / 建案管理</h2>
      </div>

      <!-- 搜尋條件 -->
      <div class="bg-white rounded shadow-sm p-6 mb-6">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="text-base font-bold text-gray-700">搜尋條件</h3>
            <p class="text-xs text-gray-400 mt-1">可依案件編號或建案名稱篩選</p>
          </div>
          <div class="flex items-center gap-2">
            <button class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="plus" class="w-4 h-4"></i> 新增建案</button>
            <button class="flex items-center gap-1 bg-[#5d6b7b] hover:bg-[#4a5563] text-white px-4 py-2 rounded text-sm"><i data-lucide="file-text" class="w-4 h-4"></i> 隱私權條款(個資聲明)模板</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-20 flex-shrink-0">案件編號</label>
            <input type="text" placeholder="請輸入案件編號" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-20 flex-shrink-0">建案名稱</label>
            <input type="text" placeholder="請輸入建案名稱" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <button class="flex items-center gap-1 border border-gray-300 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded text-sm"><i data-lucide="eraser" class="w-4 h-4"></i> 清除</button>
          <button class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="search" class="w-4 h-4"></i> 搜尋</button>
        </div>
      </div>

      <!-- 列表 -->
      <div class="bg-white rounded shadow-sm">
        <div class="overflow-x-auto p-6">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="table-header-bg text-white">
                <th class="p-3 text-left font-medium whitespace-nowrap">ID</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">案件編號</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">建案名稱</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">地段</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">棟數</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">代銷公司</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">相關人員</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">狀態</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <tr class="hover:bg-gray-50">
                <td class="p-3 align-top">11</td>
                <td class="p-3 align-top">123asd</td>
                <td class="p-3 align-top">画世代</td>
                <td class="p-3 align-top">台北市信義區信義路125號</td>
                <td class="p-3 align-top">2</td>
                <td class="p-3 align-top max-w-[180px] whitespace-normal leading-relaxed">北區,南區,外島,新理想,元捷整合行銷,聯碩,Unicorn,莉薇</td>
                <td class="p-3 align-top">李xx陳xx</td>
                <td class="p-3 align-top">已開案</td>
                <td class="p-3 align-top">
                  <div class="flex flex-wrap gap-1 items-start min-w-[260px]">
                    <a href="building-edit.html?id=11" class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="edit-3" class="w-3 h-3"></i> 編輯</a>
                    <button class="border border-red-300 text-red-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-red-50"><i data-lucide="trash-2" class="w-3 h-3"></i> 刪除</button>
                    <button class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="home" class="w-3 h-3"></i> 查看房屋資料</button>
                    <button class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="car" class="w-3 h-3"></i> 查看車位</button>
                    <button class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="tag" class="w-3 h-3"></i> 建案標籤</button>
                  </div>
                </td>
              </tr>
              <tr class="bg-gray-50 hover:bg-gray-100">
                <td class="p-3 align-top">12</td>
                <td class="p-3 align-top">TheTop</td>
                <td class="p-3 align-top">TheTop</td>
                <td class="p-3 align-top">新北市新莊區</td>
                <td class="p-3 align-top">3</td>
                <td class="p-3 align-top max-w-[180px] whitespace-normal leading-relaxed">北區,南區,東區,新高創,元捷整合行銷,聯碩,莉薇</td>
                <td class="p-3 align-top">王小明</td>
                <td class="p-3 align-top">已開案</td>
                <td class="p-3 align-top">
                  <div class="flex flex-wrap gap-1 items-start min-w-[260px]">
                    <a href="building-edit.html?id=12" class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="edit-3" class="w-3 h-3"></i> 編輯</a>
                    <button class="border border-red-300 text-red-500 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-red-50"><i data-lucide="trash-2" class="w-3 h-3"></i> 刪除</button>
                    <button class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="home" class="w-3 h-3"></i> 查看房屋資料</button>
                    <button class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="car" class="w-3 h-3"></i> 查看車位</button>
                    <button class="border border-gray-300 text-gray-600 px-2 py-1 rounded text-xs flex items-center gap-1 hover:bg-gray-100"><i data-lucide="tag" class="w-3 h-3"></i> 建案標籤</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
