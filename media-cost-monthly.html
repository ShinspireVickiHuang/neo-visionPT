<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>月媒體執行總表 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .mc-table { border-collapse: collapse; font-size: 11px; }
    .mc-table td, .mc-table th {
      border: 1px solid #ccc; padding: 3px 6px;
      text-align: center; white-space: nowrap;
    }
    .mc-table .left { text-align: left; }
    .th-dark  { background: #5d6b7b; color: #fff; font-weight: 600; }
    .th-mid   { background: #8d9aaa; color: #fff; font-weight: 500; }
    .th-light { background: #dde2e7; color: #3d3530; font-weight: 600; }
    .cat-row  { background: #e0d8ce; font-weight: 700; }
    .sub-row  { background: #f0ece8; color: #7a6e64; font-style: italic; }
    .stats-row{ background: #f5f8fc; }
    .total-row{ background: #edf0f4; font-weight: 700; }
    .avg-row  { background: #fdf8f2; }

    /* ── 凍結標題列：表格容器 overflow:auto，thead sticky top:0 ── */
    #mainTable thead { position: sticky; top: 0; z-index: 3; }

    /* ── 凍結左側項目欄（item 資料行）── */
    .col-cat  { position: sticky; left: 0;    z-index: 2; background: white; }
    .col-no   { position: sticky; left: 12px; z-index: 2; background: white; }
    .col-name { position: sticky; left: 62px; z-index: 2; background: white;
                box-shadow: 2px 0 4px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="content-bg font-sans text-gray-700">

  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <main class="flex-1 p-6 overflow-x-hidden">

      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-bold text-gray-700">
          <a href="media-cost-list.html" class="hover:text-blue-600">媒體執行總表(來人暨成交平均媒體花費)</a> /
          月媒體執行總表
        </h2>
        <a href="media-cost-list.html" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-600 border border-gray-300 px-3 py-1.5 rounded text-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回列表
        </a>
      </div>

      <!-- 建案/年度/月份 資訊列 -->
      <div class="bg-white rounded shadow-sm px-6 py-3 mb-4 flex items-center gap-8 text-sm border">
        <div class="flex items-center gap-2"><span class="text-gray-500">建案</span><span id="lblBldg" class="font-semibold text-gray-800">—</span></div>
        <div class="flex items-center gap-2"><span class="text-gray-500">年度</span><span id="lblYear" class="font-semibold text-gray-800">—</span></div>
        <div class="flex items-center gap-2"><span class="text-gray-500">月份</span><span id="lblMonth" class="font-semibold text-gray-800">—</span></div>
      </div>

      <!-- 主表格：overflow:auto 讓表格容器內捲動，thead sticky top:0 正常運作 -->
      <div class="bg-white rounded shadow-sm p-4" id="mainTableWrap" style="overflow:auto; max-height:calc(100vh - 280px)">
        <div class="text-center font-bold text-base mb-3 text-gray-800">媒體執行總表(來人暨成交平均媒體花費)</div>

        <table class="mc-table" id="mainTable">
          <colgroup>
            <col style="width:12px"><col style="width:50px"><col style="width:200px">
            <col style="width:90px"><col style="width:90px"><col style="width:90px">
            <col style="width:90px"><col style="width:90px"><col style="width:90px">
            <col style="width:90px"><col style="width:70px"><col style="width:90px">
            <col style="width:90px"><col style="width:70px"><col style="width:90px">
          </colgroup>
          <thead>
            <tr>
              <th class="th-dark" colspan="3" rowspan="2">項目</th>
              <th class="th-dark" rowspan="2">開案</th>
              <th class="th-dark" colspan="4" id="hWeeks">週次</th>
              <th class="th-dark" colspan="4">當月累計</th>
              <th class="th-dark" colspan="3">全案累計</th>
            </tr>
            <tr>
              <th class="th-mid" id="hW1">第1週</th>
              <th class="th-mid" id="hW2">第2週</th>
              <th class="th-mid" id="hW3">第3週</th>
              <th class="th-mid" id="hW4">第4週</th>
              <th class="th-mid">費用</th>
              <th class="th-mid">本月key-in</th>
              <th class="th-mid">比例</th>
              <th class="th-mid">小計</th>
              <th class="th-mid">費用</th>
              <th class="th-mid">比例</th>
              <th class="th-mid">小計</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

      <!-- 不含人事薪資管銷 / 薪資+管銷 獨立區塊 -->
      <div class="bg-gray-100 rounded border border-gray-300 p-4 mt-4 overflow-x-auto">
        <table class="mc-table" id="salaryTable" style="background:#e8eaed">
          <thead>
            <tr>
              <th class="th-light" style="min-width:200px; text-align:left; padding-left:8px">項目</th>
              <th class="th-light" style="min-width:90px">開案</th>
              <th class="th-light" id="hW1s" style="min-width:90px"></th>
              <th class="th-light" id="hW2s" style="min-width:90px"></th>
              <th class="th-light" id="hW3s" style="min-width:90px"></th>
              <th class="th-light" id="hW4s" style="min-width:90px"></th>
              <th class="th-light" style="min-width:110px">當月累計</th>
              <th class="th-light" style="min-width:110px">全案累計</th>
            </tr>
          </thead>
          <tbody>
            <tr class="total-row">
              <td class="left" style="padding-left:8px">不含人事薪資管銷</td>
              <td>1,320,000</td>
              <td>107,500</td><td>156,000</td><td>104,500</td><td>112,500</td>
              <td>1,800,500</td><td>1,800,500</td>
            </tr>
            <tr class="total-row" style="background:#dde2e7">
              <td class="left" style="padding-left:8px">薪資+管銷</td>
              <td>—</td>
              <td>80,000</td><td>80,000</td><td>80,000</td><td>80,000</td>
              <td>320,000</td><td>320,000</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    // ── URL 參數 ──
    const p = new URLSearchParams(location.search);
    document.getElementById('lblBldg').textContent  = p.get('building') || '—';
    document.getElementById('lblYear').textContent  = p.get('year')     || '—';
    document.getElementById('lblMonth').textContent = p.get('month')    || '—';

    // 週次標題
    const weeks = [
      p.get('w1') || '第1週',
      p.get('w2') || '第2週',
      p.get('w3') || '第3週',
      p.get('w4') || '第4週',
    ];
    ['hW1','hW2','hW3','hW4'].forEach((id, i) => {
      document.getElementById(id).textContent = weeks[i];
    });
    ['hW1s','hW2s','hW3s','hW4s'].forEach((id, i) => {
      const el = document.getElementById(id);
      if (el) el.textContent = weeks[i];
    });

    // ── 費用項目資料 ──
    const ITEMS = [
      { cat:'開案費用', sub:'其他',   no:'1',     name:'接待中心(籌備處＋接待中心）' },
      { cat:'',         sub:'',       no:'2',     name:'電費保證金' },
      { cat:'',         sub:'',       no:'3',     name:'模型' },
      { cat:'',         sub:'',       no:'4',     name:'攝影費（平面、空拍、720）' },
      { cat:'',         sub:'',       no:'5',     name:'企劃費' },
      { cat:'',         sub:'',       no:'6',     name:'電子裱版' },
      { cat:'',         sub:'',       no:'7',     name:'平面圖(墨線)' },
      { cat:'',         sub:'',       no:'8',     name:'透視圖' },
      { cat:'',         sub:'實品屋', no:'9',     name:'實品屋' },
      { cat:'',         sub:'',       no:'10',    name:'實品屋損失' },
      { cat:'固定費用', sub:'',       no:'11',    name:'接待中心.管理費.停車場租金' },
      { cat:'',         sub:'',       no:'12',    name:'投射燈' },
      { cat:'',         sub:'',       no:'13',    name:'羅馬旗' },
      { cat:'',         sub:'',       no:'14',    name:'冷氣費' },
      { cat:'',         sub:'',       no:'15',    name:'保全費（中興＋新光）' },
      { cat:'',         sub:'',       no:'16',    name:'補充保費' },
      { cat:'',         sub:'',       no:'17',    name:'電話費' },
      { cat:'',         sub:'',       no:'18',    name:'水電費' },
      { cat:'',         sub:'',       no:'19',    name:'定點租金' },
      { cat:'媒體費用', sub:'大眾',   no:'20',    name:'CF製作費' },
      { cat:'',         sub:'',       no:'21',    name:'CF播放費' },
      { cat:'',         sub:'',       no:'22',    name:'RD播放費' },
      { cat:'',         sub:'',       no:'23',    name:'報紙廣告費(NP)' },
      { cat:'',         sub:'',       no:'24',    name:'雜誌廣告費' },
      { cat:'',         sub:'',       no:'25',    name:'網路廣告費' },
      { cat:'',         sub:'小眾',   no:'26',    name:'竹架' },
      { cat:'',         sub:'',       no:'27',    name:'帆布看板' },
      { cat:'',         sub:'',       no:'28',    name:'宣傳車及定點車' },
      { cat:'',         sub:'',       no:'29',    name:'公車廣告費' },
      { cat:'',         sub:'',       no:'30',    name:'印刷品' },
      { cat:'',         sub:'',       no:'31',    name:'指示牌' },
      { cat:'',         sub:'',       no:'32',    name:'派夾報' },
      { cat:'非固定費用', sub:'',     no:'33',    name:'制服費' },
      { cat:'',           sub:'',     no:'34',    name:'介紹費' },
      { cat:'',           sub:'',     no:'35',    name:'贈品（存錢筒）' },
      { cat:'',           sub:'',     no:'36',    name:'其他租金(接駁車.宿舍)' },
      { cat:'',           sub:'',     no:'37',    name:'代言人/活動費' },
      { cat:'',           sub:'',     no:'38',    name:'業主扣款' },
      { cat:'',           sub:'',     no:'39',    name:'雜支(打工.工讀生.SP.零用金)' },
      { cat:'固定費用',   sub:'',     no:'40.41', name:'餐費/薪資' },
      { cat:'',           sub:'',     no:'42',    name:'管銷費' },
      { cat:'非固定',     sub:'',     no:'43',    name:'獎金（千分之五）' },
      { cat:'',           sub:'',     no:'44',    name:'稅金（佣金/1.05*0.08）' },
    ];

    // 12 cells: 開案+週1-4+當月費用+key-in+當月比例+當月小計+全案費用+全案比例+全案小計
    const EMPTY_ROW = '<td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>';

    // 假資料：[開案, 週1, 週2, 週3, 週4, 當月費用, key-in, 當月比例, 當月小計, 全案費用, 全案比例, 全案小計]
    const DATA = {
      '1':     ['850,000','—','—','—','—','850,000','850,000','36.2%','850,000','850,000','36.2%','850,000'],
      '3':     ['120,000','—','—','—','—','120,000','120,000','5.1%','120,000','120,000','5.1%','120,000'],
      '4':     ['150,000','—','—','—','—','150,000','150,000','6.4%','150,000','150,000','6.4%','150,000'],
      '5':     ['200,000','—','—','—','—','200,000','200,000','8.5%','200,000','200,000','8.5%','200,000'],
      '11':    ['—','33,000','33,000','33,000','33,000','132,000','132,000','5.6%','132,000','132,000','5.6%','132,000'],
      '14':    ['—','11,000','11,000','11,000','11,000','44,000','44,000','1.9%','44,000','44,000','1.9%','44,000'],
      '15':    ['—','3,600','3,600','3,600','3,600','14,400','14,400','0.6%','14,400','14,400','0.6%','14,400'],
      '17':    ['—','800','800','800','800','3,200','3,200','0.1%','3,200','3,200','0.1%','3,200'],
      '18':    ['—','2,500','2,500','2,500','2,500','10,000','10,000','0.4%','10,000','10,000','0.4%','10,000'],
      '19':    ['—','25,000','25,000','25,000','25,000','100,000','100,000','4.3%','100,000','100,000','4.3%','100,000'],
      '25':    ['—','15,000','18,000','12,000','20,000','65,000','65,000','2.8%','65,000','65,000','2.8%','65,000'],
      '30':    ['—','8,000','8,000','8,000','8,000','32,000','32,000','1.4%','32,000','32,000','1.4%','32,000'],
      '32':    ['—','5,000','5,000','5,000','5,000','20,000','20,000','0.9%','20,000','20,000','0.9%','20,000'],
      '35':    ['—','—','5,000','—','—','5,000','5,000','0.2%','5,000','5,000','0.2%','5,000'],
      '39':    ['—','3,000','3,000','3,000','3,000','12,000','12,000','0.5%','12,000','12,000','0.5%','12,000'],
      '40.41': ['—','65,000','65,000','65,000','65,000','260,000','260,000','11.1%','260,000','260,000','11.1%','260,000'],
      '42':    ['—','15,000','15,000','15,000','15,000','60,000','60,000','2.6%','60,000','60,000','2.6%','60,000'],
      '43':    ['—','—','22,500','—','—','22,500','22,500','1.0%','22,500','22,500','1.0%','22,500'],
      '44':    ['—','—','18,000','—','—','18,000','18,000','0.8%','18,000','18,000','0.8%','18,000'],
    };

    function dataRow(d) {
      return d.map(v => `<td>${v}</td>`).join('');
    }

    function buildRows() {
      const tbody = document.getElementById('tableBody');
      let html = '';

      // 統計列（來人/成交/週成交只有當月/全案有值，對齊 Excel）
      html += `<tr class="stats-row">
        <td colspan="3" class="left font-semibold">來人組數</td>
        <td>0</td><td>—</td><td>—</td><td>—</td><td>—</td>
        <td>53</td><td>—</td><td>—</td><td>—</td>
        <td>120</td><td>—</td><td>—</td>
      </tr>`;
      html += `<tr class="stats-row">
        <td colspan="3" class="left font-semibold">成交戶數</td>
        <td>0</td><td>—</td><td>—</td><td>—</td><td>—</td>
        <td>10</td><td>—</td><td>—</td><td>—</td>
        <td>22</td><td>—</td><td>—</td>
      </tr>`;
      html += `<tr class="stats-row">
        <td colspan="3" class="left font-semibold">週成交總銷</td>
        <td>0</td><td>—</td><td>—</td><td>—</td><td>—</td>
        <td>50,000,000</td><td>—</td><td>—</td><td>—</td>
        <td>110,000,000</td><td>—</td><td>—</td>
      </tr>`;

      let prevCat = null, prevSub = null;
      ITEMS.forEach(item => {
        if (item.cat && item.cat !== prevCat) {
          html += `<tr class="cat-row"><td class="left" colspan="15">${item.cat}</td></tr>`;
          prevCat = item.cat; prevSub = null;
        }
        if (item.sub && item.sub !== prevSub) {
          html += `<tr class="sub-row"><td></td><td class="left" colspan="14">${item.sub}</td></tr>`;
          prevSub = item.sub;
        }
        const rowData = DATA[item.no] ? dataRow(DATA[item.no]) : EMPTY_ROW;
        html += `<tr>
          <td class="col-cat"></td>
          <td class="col-no text-right pr-2">${item.no}</td>
          <td class="col-name left">${item.name}</td>
          ${rowData}
        </tr>`;
      });

      const totalRow = (label, vals) =>
        `<tr class="total-row"><td class="left" colspan="3">${label}</td>${vals}</tr>`;

      const tMedia  = '<td>—</td><td>28,000</td><td>36,000</td><td>25,000</td><td>33,000</td><td>122,000</td><td>122,000</td><td>5.8%</td><td>122,000</td><td>122,000</td><td>5.8%</td><td>122,000</td>';
      const tTotal  = '<td>1,320,000</td><td>187,500</td><td>236,000</td><td>184,500</td><td>192,500</td><td>2,120,500</td><td>2,120,500</td><td>100%</td><td>2,120,500</td><td>2,120,500</td><td>100%</td><td>2,120,500</td>';
      const tComm   = '<td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>424,100</td><td>424,100</td><td>20%</td><td>424,100</td><td>424,100</td><td>20%</td><td>424,100</td>';
      const tProfit = '<td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>';
      html += totalRow('純媒體費用小計', tMedia);
      html += totalRow('總費用合計',     tTotal);
      html += totalRow('預估佣金',       tComm);
      html += totalRow('預估淨利',       tProfit);

      // 媒體平均週花費
      html += `<tr class="th-light" style="font-size:10px">
        <td colspan="8"></td>
        <td colspan="2">純媒體平均成本</td>
        <td colspan="2">總費用平均成本</td>
        <td>純媒體平均成本</td>
        <td colspan="2">總費用平均成本</td>
      </tr>`;
      html += `<tr class="avg-row">
        <td class="left" colspan="2" rowspan="2">媒體平均週花費</td>
        <td class="left">來人</td>
        <td>—</td>
        <td>2,333</td><td>2,400</td><td>3,125</td><td>1,833</td>
        <td colspan="2">2,302/組</td>
        <td colspan="2">40,009/組</td>
        <td>2,302/組</td>
        <td colspan="2">40,009/組</td>
      </tr>`;
      html += `<tr class="avg-row">
        <td class="left">成交</td>
        <td>—</td>
        <td>14,000</td><td>12,000</td><td>25,000</td><td>8,250</td>
        <td colspan="2">12,200/戶</td>
        <td colspan="2">212,050/戶</td>
        <td>12,200/戶</td>
        <td colspan="2">212,050/戶</td>
      </tr>`;

      tbody.innerHTML = html;
    }

    buildRows();
  </script>
  <script>lucide.createIcons();</script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
