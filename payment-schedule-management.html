<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>繳款期別管理 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <!-- 頂部 -->
  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <!-- 左側選單 -->
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <!-- 主內容 -->
    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">繳款期別管理</h2>
        <p class="text-xs text-gray-400 mt-1">建立多組期別範本（付款辦法），供各建案選擇套用；套用後即可在「繳款紀錄管理」編輯各戶的繳款紀錄</p>
      </div>

      <!-- 搜尋條件 -->
      <div class="bg-white rounded shadow-sm p-6 mb-6">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="text-base font-bold text-gray-700">搜尋條件</h3>
            <p class="text-xs text-gray-400 mt-1">可依範本名稱篩選；或輸入建案名稱，反查該建案套用哪一組範本</p>
          </div>
          <button id="btnAddTpl" class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm flex-shrink-0"><i data-lucide="plus" class="w-4 h-4"></i> 新增期別範本</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-20 flex-shrink-0">範本名稱</label>
            <input id="fName" type="text" placeholder="請輸入範本名稱" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-20 flex-shrink-0">建案名稱</label>
            <input id="fProject" type="text" placeholder="輸入建案名稱，查該建案套用的範本" class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button id="btnReset" class="flex items-center gap-1 border border-gray-300 text-gray-600 hover:bg-gray-100 px-4 py-2 rounded text-sm"><i data-lucide="eraser" class="w-4 h-4"></i> 清除</button>
          <button id="btnSearch" class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="search" class="w-4 h-4"></i> 搜尋</button>
        </div>
      </div>

      <!-- 範本清單 -->
      <div id="tplList" class="space-y-4"></div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    // ============================================================
    // 期別範本範例資料（之後改為從 API 帶入）
    // dueRule：應繳時點規則（簽約後 N 天／指定工程節點）
    // 建案數會隨經營年數累積（數十到數百案），因此：
    //   - 套用關係記在建案上（appliedTpl），一案一範本
    //   - 範本卡只顯示套用「數量」，明細與套用一律靠搜尋
    // ============================================================
    const PROJECTS = [
      { name:'新理想',     appliedTpl:1 },
      { name:'畫世代',     appliedTpl:2 },
      { name:'TheTop',     appliedTpl:2 },
      { name:'河岸首席',   appliedTpl:1 },
      { name:'雲端花園',   appliedTpl:2 },
      { name:'市心大觀',   appliedTpl:1 },
      { name:'綠光敦南',   appliedTpl:null },
      { name:'湖畔莊園',   appliedTpl:null },
      { name:'學府特區',   appliedTpl:2 },
      { name:'站前之星',   appliedTpl:1 },
      { name:'風華再現',   appliedTpl:null },
    ];
    const TEMPLATES = [
      {
        id: 1, name: '標準 6 期（訂簽開＋工程期款）',
        stages: [
          { stage:'訂金',      pct:3,  dueRule:'下訂當日' },
          { stage:'簽約款',    pct:7,  dueRule:'簽約後 7 天' },
          { stage:'開工款',    pct:5,  dueRule:'開工日' },
          { stage:'工程期款1', pct:5,  dueRule:'結構體完成 1/2' },
          { stage:'工程期款2', pct:5,  dueRule:'結構體完成' },
          { stage:'交屋款',    pct:75, dueRule:'交屋（含銀行貸款）' },
        ]
      },
      {
        id: 2, name: '精簡 3 期（訂簽＋交屋）',
        stages: [
          { stage:'訂金',   pct:5,  dueRule:'下訂當日' },
          { stage:'簽約款', pct:10, dueRule:'簽約後 7 天' },
          { stage:'交屋款', pct:85, dueRule:'交屋（含銀行貸款）' },
        ]
      },
      {
        id: 3, name: '工程期款 12 期（按月）',
        stages: [
          { stage:'訂金',        pct:3,  dueRule:'下訂當日' },
          { stage:'簽約款',      pct:7,  dueRule:'簽約後 7 天' },
          { stage:'開工款',      pct:5,  dueRule:'開工日' },
          { stage:'工程期款1-12', pct:1,  dueRule:'開工後按月繳付（每期 1%，共 12 期）' },
          { stage:'交屋款',      pct:73, dueRule:'交屋（含銀行貸款）' },
        ]
      },
    ];

    // 某範本已套用的建案清單
    const appliedProjects = tplId => PROJECTS.filter(p => p.appliedTpl === tplId);

    // 範本卡展開狀態（預設全部收合，點標題列展開；搜尋重繪時保留）
    const expandedTpls = new Set();
    function toggleTpl(id) {
      expandedTpls.has(id) ? expandedTpls.delete(id) : expandedTpls.add(id);
      render();
    }

    function render() {
      const kw = document.getElementById('fName').value.trim();
      const pj = document.getElementById('fProject').value.trim();
      const list = document.getElementById('tplList');
      list.innerHTML = '';

      let rows = TEMPLATES.filter(t => !kw || t.name.includes(kw));
      // 建案反查：只顯示該建案套用的範本
      let pjHint = '';
      if (pj) {
        const matched = PROJECTS.filter(p => p.name.includes(pj));
        const tplIds = new Set(matched.map(p => p.appliedTpl).filter(Boolean));
        rows = rows.filter(t => tplIds.has(t.id));
        const noTplNames = matched.filter(p => !p.appliedTpl).map(p => p.name);
        pjHint = `<div class="bg-white rounded shadow-sm px-6 py-3 text-sm text-gray-600">建案「${pj}」符合 ${matched.length} 案${noTplNames.length ? `；其中 <span class="text-red-500">${noTplNames.join('、')}</span> 尚未套用任何範本` : ''}</div>`;
      }

      if (pjHint) list.insertAdjacentHTML('beforeend', pjHint);
      if (!rows.length) {
        list.insertAdjacentHTML('beforeend', '<div class="bg-white rounded shadow-sm p-10 text-center text-gray-400 text-sm">查無符合的期別範本</div>');
        return;
      }

      rows.forEach(t => {
        const totalPct = t.stages.reduce((s, x) => s + x.pct, 0);
        const appliedCount = appliedProjects(t.id).length;
        const stageRows = t.stages.map((s, i) => `
          <tr class="${i % 2 ? 'bg-gray-50' : ''}">
            <td class="p-2.5 text-sm whitespace-nowrap">${i + 1}</td>
            <td class="p-2.5 text-sm whitespace-nowrap font-medium">${s.stage}</td>
            <td class="p-2.5 text-sm text-right whitespace-nowrap">${s.pct}%</td>
            <td class="p-2.5 text-sm text-gray-600">${s.dueRule}</td>
          </tr>`).join('');

        const expanded = expandedTpls.has(t.id);
        const card = document.createElement('div');
        card.className = 'bg-white rounded shadow-sm p-6';
        card.innerHTML = `
          <div class="flex items-start justify-between ${expanded ? 'mb-3' : ''}">
            <div class="cursor-pointer flex-1" onclick="toggleTpl(${t.id})" title="${expanded ? '點擊收合' : '點擊展開期別明細'}">
              <div class="flex items-center gap-3">
                <i data-lucide="${expanded ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4 text-gray-400 flex-shrink-0"></i>
                <h3 class="text-base font-bold text-gray-700">${t.name}</h3>
                <span class="text-xs text-gray-400">${t.stages.length} 期</span>
                <span class="text-xs ${totalPct === 100 ? 'text-green-600' : 'text-red-500 font-bold'}">合計 ${totalPct}%${totalPct !== 100 ? '（未達 100%，請檢查）' : ''}</span>
              </div>
              <div class="mt-2 text-xs text-gray-500 pl-7">
                已套用 <b class="text-gray-800">${appliedCount}</b> 個建案
                ${appliedCount ? `<a href="#" class="text-blue-600 hover:underline ml-1" onclick="event.stopPropagation();openAppliedModal(${t.id});return false;">查看清單</a>` : ''}
              </div>
            </div>
            <div class="flex gap-2 flex-shrink-0">
              <button class="border border-gray-300 text-gray-600 px-3 py-1.5 rounded text-xs flex items-center gap-1 hover:bg-gray-100" onclick="openTplModal(${t.id})"><i data-lucide="edit-3" class="w-3 h-3"></i> 編輯</button>
              <button class="border border-gray-300 text-gray-600 px-3 py-1.5 rounded text-xs flex items-center gap-1 hover:bg-gray-100" onclick="alert('複製範本（範例）：${t.name}')"><i data-lucide="copy" class="w-3 h-3"></i> 複製</button>
              <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-3 py-1.5 rounded text-xs flex items-center gap-1" onclick="openApplyModal(${t.id})"><i data-lucide="building-2" class="w-3 h-3"></i> 套用到建案</button>
            </div>
          </div>
          ${expanded ? `
          <div class="overflow-x-auto border rounded">
            <table class="w-full border-collapse">
              <thead>
                <tr class="bg-gray-100">
                  <th class="p-2.5 text-left text-xs text-gray-500 font-medium w-12">#</th>
                  <th class="p-2.5 text-left text-xs text-gray-500 font-medium">期別</th>
                  <th class="p-2.5 text-right text-xs text-gray-500 font-medium w-28">繳款比例</th>
                  <th class="p-2.5 text-left text-xs text-gray-500 font-medium">應繳時點</th>
                </tr>
              </thead>
              <tbody class="divide-y">${stageRows}</tbody>
            </table>
          </div>` : ''}`;
        list.appendChild(card);
      });
      lucide.createIcons();
    }

    document.getElementById('fName').addEventListener('input', render);
    document.getElementById('fProject').addEventListener('input', render);
    document.getElementById('btnSearch').onclick = render;
    document.getElementById('btnReset').onclick = () => {
      document.getElementById('fName').value = '';
      document.getElementById('fProject').value = '';
      render();
    };
    document.getElementById('btnAddTpl').onclick = () => openTplModal(null);

    // ============================================================
    // 查看已套用建案清單（可搜尋，建案多時不怕爆量）
    // ============================================================
    function openAppliedModal(id) {
      const old = document.getElementById('__appliedModal__');
      if (old) old.remove();
      const t = TEMPLATES.find(x => x.id === id);
      const inputStyle = "width:100%;border:1px solid #d1d5db;border-radius:4px;padding:8px 12px;font-size:14px;background:#f9fafb;box-sizing:border-box;";

      const modal = document.createElement('div');
      modal.id = '__appliedModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:480px;box-shadow:0 20px 50px rgba(0,0,0,0.25);margin-top:80px;">
          <div style="padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <div>
              <span style="font-weight:bold;font-size:16px;color:#374151;">已套用建案</span>
              <div style="font-size:13px;color:#6b7280;margin-top:4px;">範本：${t.name}</div>
            </div>
            <button id="__apCloseBtn__" style="background:#fff;border:1px solid #d1d5db;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;color:#374151;">✕</button>
          </div>
          <div style="padding:16px 24px;">
            <input id="__apKw__" type="text" placeholder="搜尋建案名稱" style="${inputStyle};margin-bottom:10px;">
            <div id="__apList__" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
          </div>
          <div style="padding:14px 24px 20px;display:flex;justify-content:center;border-top:1px solid #e5e7eb;background:#fafafa;">
            <button id="__apDoneBtn__" style="background:#fff;color:#374151;border:1px solid #d1d5db;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">關閉</button>
          </div>
        </div>`;
      document.body.appendChild(modal);

      const renderList = () => {
        const kw = modal.querySelector('#__apKw__').value.trim();
        const items = appliedProjects(id).filter(p => !kw || p.name.includes(kw));
        modal.querySelector('#__apList__').innerHTML = items.length
          ? items.map(p => `<div style="font-size:14px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;">${p.name}</div>`).join('')
          : '<div style="font-size:13px;color:#9ca3af;text-align:center;padding:14px;">查無符合的建案</div>';
      };
      renderList();
      modal.querySelector('#__apKw__').addEventListener('input', renderList);
      const close = () => modal.remove();
      modal.querySelector('#__apCloseBtn__').onclick = close;
      modal.querySelector('#__apDoneBtn__').onclick = close;
      modal.addEventListener('click', e => { if (e.target === modal) close(); });
    }

    // ============================================================
    // 新增／編輯範本彈窗：範本名稱＋期別明細（可增刪列）
    // ============================================================
    function openTplModal(id) {
      const old = document.getElementById('__tplModal__');
      if (old) old.remove();
      const t = id ? TEMPLATES.find(x => x.id === id) : null;
      const stages = t ? t.stages : [{ stage:'訂金', pct:'', dueRule:'' }];

      const inputStyle = "width:100%;border:1px solid #d1d5db;border-radius:4px;padding:7px 10px;font-size:13px;background:#f9fafb;box-sizing:border-box;";
      const stageRow = (s = { stage:'', pct:'', dueRule:'' }) => `
        <tr>
          <td style="padding:6px;"><input type="text" value="${s.stage}" placeholder="期別名稱" style="${inputStyle}"></td>
          <td style="padding:6px;width:110px;"><input type="number" value="${s.pct}" placeholder="%" min="0" max="100" style="${inputStyle};text-align:right;"></td>
          <td style="padding:6px;"><input type="text" value="${s.dueRule}" placeholder="應繳時點（如：簽約後 7 天／開工日）" style="${inputStyle}"></td>
          <td style="padding:6px;width:44px;text-align:center;"><button onclick="this.closest('tr').remove()" style="border:1px solid #fca5a5;background:#fff;color:#ef4444;width:28px;height:28px;border-radius:4px;cursor:pointer;">✕</button></td>
        </tr>`;

      const modal = document.createElement('div');
      modal.id = '__tplModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(0,0,0,0.25);">
          <div style="padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:bold;font-size:16px;color:#374151;">${t ? '編輯期別範本' : '新增期別範本'}</span>
            <button id="__tplCloseBtn__" style="background:#fff;border:1px solid #d1d5db;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;color:#374151;">✕</button>
          </div>
          <div style="padding:18px 24px;">
            <label style="font-size:13px;color:#374151;display:block;margin-bottom:4px;">範本名稱 <span style="color:#ef4444;">*</span></label>
            <input type="text" value="${t ? t.name : ''}" placeholder="例：標準 6 期（訂簽開＋工程期款）" style="${inputStyle};margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <span style="font-size:13px;font-weight:bold;color:#374151;">期別明細 <span style="font-weight:normal;color:#9ca3af;">（比例合計須為 100%）</span></span>
              <button id="__addStageBtn__" style="background:#5d6b7b;color:#fff;border:0;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px;">＋ 加一期</button>
            </div>
            <table style="width:100%;border-collapse:collapse;">
              <thead>
                <tr style="background:#f3f4f6;">
                  <th style="padding:8px;text-align:left;font-size:12px;color:#6b7280;font-weight:500;">期別</th>
                  <th style="padding:8px;text-align:left;font-size:12px;color:#6b7280;font-weight:500;">比例(%)</th>
                  <th style="padding:8px;text-align:left;font-size:12px;color:#6b7280;font-weight:500;">應繳時點</th>
                  <th style="padding:8px;"></th>
                </tr>
              </thead>
              <tbody id="__stageTbody__">${stages.map(stageRow).join('')}</tbody>
            </table>
          </div>
          <div style="padding:14px 24px 20px;display:flex;justify-content:center;gap:10px;border-top:1px solid #e5e7eb;background:#fafafa;">
            <button id="__tplSaveBtn__" style="background:#a09080;color:#fff;border:0;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">儲存</button>
            <button id="__tplCancelBtn__" style="background:#fff;color:#374151;border:1px solid #d1d5db;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">取消</button>
          </div>
        </div>`;

      document.body.appendChild(modal);
      const close = () => modal.remove();
      modal.querySelector('#__tplCloseBtn__').onclick = close;
      modal.querySelector('#__tplCancelBtn__').onclick = close;
      modal.querySelector('#__tplSaveBtn__').onclick = () => { alert('已儲存（範例）'); close(); };
      modal.querySelector('#__addStageBtn__').onclick = () => {
        modal.querySelector('#__stageTbody__').insertAdjacentHTML('beforeend', stageRow());
      };
      modal.addEventListener('click', e => { if (e.target === modal) close(); });
    }

    // ============================================================
    // 套用到建案彈窗：先搜尋建案再勾選（建案量大時不整頁列出）
    // 一個建案同時只能套用一組範本，重套會提示將覆蓋
    // ============================================================
    function openApplyModal(id) {
      const old = document.getElementById('__applyModal__');
      if (old) old.remove();
      const t = TEMPLATES.find(x => x.id === id);
      const inputStyle = "width:100%;border:1px solid #d1d5db;border-radius:4px;padding:8px 12px;font-size:14px;background:#f9fafb;box-sizing:border-box;";
      const tplName = tid => (TEMPLATES.find(x => x.id === tid) || {}).name || '';

      const modal = document.createElement('div');
      modal.id = '__applyModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,0.25);margin-top:60px;">
          <div style="padding:16px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <div>
              <span style="font-weight:bold;font-size:16px;color:#374151;">套用到建案</span>
              <div style="font-size:13px;color:#6b7280;margin-top:4px;">範本：${t.name}</div>
            </div>
            <button id="__applyCloseBtn__" style="background:#fff;border:1px solid #d1d5db;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;color:#374151;">✕</button>
          </div>
          <div style="padding:16px 24px;">
            <input id="__applyKw__" type="text" placeholder="輸入建案名稱關鍵字搜尋（例：新、河岸）" style="${inputStyle};margin-bottom:8px;">
            <div style="font-size:12px;color:#9ca3af;margin-bottom:10px;">※ 一個建案同時只能套用一組範本；已套用其他範本的建案，勾選後將改套用本範本</div>
            <div id="__applyList__" style="max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
          </div>
          <div style="padding:14px 24px 20px;display:flex;justify-content:center;gap:10px;border-top:1px solid #e5e7eb;background:#fafafa;">
            <button id="__applySaveBtn__" style="background:#a09080;color:#fff;border:0;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">套用</button>
            <button id="__applyCancelBtn__" style="background:#fff;color:#374151;border:1px solid #d1d5db;padding:8px 28px;border-radius:4px;cursor:pointer;font-size:14px;">取消</button>
          </div>
        </div>`;

      document.body.appendChild(modal);
      const checked = new Set();   // 本次勾選要套用的建案

      const renderList = () => {
        const kw = modal.querySelector('#__applyKw__').value.trim();
        const listEl = modal.querySelector('#__applyList__');
        if (!kw) {
          listEl.innerHTML = '<div style="font-size:13px;color:#9ca3af;text-align:center;padding:18px;">請先輸入關鍵字搜尋建案</div>';
          return;
        }
        const items = PROJECTS.filter(p => p.name.includes(kw));
        listEl.innerHTML = items.length ? items.map(p => {
          const isCurrent = p.appliedTpl === id;
          const otherTpl  = p.appliedTpl && p.appliedTpl !== id ? tplName(p.appliedTpl) : '';
          return `
            <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:${isCurrent ? 'default' : 'pointer'};padding:10px 14px;border:1px solid ${isCurrent ? '#99f6e4' : '#e5e7eb'};border-radius:6px;${isCurrent ? 'background:#f0fdfa;' : ''}">
              <input type="checkbox" data-name="${p.name}" ${isCurrent ? 'checked disabled' : (checked.has(p.name) ? 'checked' : '')}>
              <span>${p.name}</span>
              <span style="margin-left:auto;font-size:12px;color:${isCurrent ? '#0d9488' : (otherTpl ? '#d97706' : '#9ca3af')};">
                ${isCurrent ? '已套用本範本' : (otherTpl ? '目前套用：' + otherTpl : '尚未套用範本')}
              </span>
            </label>`;
        }).join('') : '<div style="font-size:13px;color:#9ca3af;text-align:center;padding:18px;">查無符合的建案</div>';

        listEl.querySelectorAll('input[type=checkbox]:not(:disabled)').forEach(cb => {
          cb.addEventListener('change', () => cb.checked ? checked.add(cb.dataset.name) : checked.delete(cb.dataset.name));
        });
      };
      renderList();
      modal.querySelector('#__applyKw__').addEventListener('input', renderList);

      const close = () => modal.remove();
      modal.querySelector('#__applyCloseBtn__').onclick = close;
      modal.querySelector('#__applyCancelBtn__').onclick = close;
      modal.addEventListener('click', e => { if (e.target === modal) close(); });
      modal.querySelector('#__applySaveBtn__').onclick = () => {
        if (!checked.size) { alert('尚未勾選任何建案'); return; }
        // 覆蓋提醒：勾選中已套用其他範本的建案
        const overwrite = [...checked].filter(n => {
          const p = PROJECTS.find(x => x.name === n);
          return p.appliedTpl && p.appliedTpl !== id;
        });
        if (overwrite.length && !confirm(`以下建案已套用其他範本，將改套用「${t.name}」：\n${overwrite.join('、')}\n\n確定要覆蓋嗎？`)) return;
        checked.forEach(n => { PROJECTS.find(x => x.name === n).appliedTpl = id; });
        close();
        render();   // 重算各範本的套用數
      };
    }

    render();
  </script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
