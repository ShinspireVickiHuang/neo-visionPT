<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>佣金收入計算 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">佣金收入計算</h2>
      </div>

      <div class="bg-white rounded shadow-sm">
        <!-- 搜尋列 -->
        <div class="p-6 border-b flex flex-wrap items-center gap-6">
          <div class="flex items-center gap-4">
            <label class="text-sm font-medium w-12">建案</label>
            <input type="text" placeholder="請輸入建案名稱" class="border rounded px-3 py-2 text-sm w-64 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex items-center gap-2 ml-auto">
            <button class="flex items-center gap-1 bg-[#5d6b7b] hover:bg-[#4a5563] text-white px-4 py-2 rounded text-sm"><i data-lucide="search" class="w-4 h-4"></i> 查詢</button>
            <button onclick="showAddCommissionModal()" class="flex items-center gap-1 bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-2 rounded text-sm"><i data-lucide="plus" class="w-4 h-4"></i> 新增佣金表</button>
          </div>
        </div>

        <!-- 表格 -->
        <div class="overflow-x-auto p-6">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="table-header-bg text-white">
                <th class="p-3 text-left font-medium whitespace-nowrap">月份</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">建案</th>
                <th class="p-3 text-left font-medium whitespace-nowrap">銷售計算期間</th>                <th class="p-3 text-right font-medium whitespace-nowrap">成交總金額 (元)</th>
                <th class="p-3 text-right font-medium whitespace-nowrap">可請佣金總金額（元）</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">審核狀況</th>
                <th class="p-3 text-center font-medium whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <!-- 列 1：未送審 -->
              <tr class="hover:bg-gray-50">
                <td class="p-3">115年4月</td>
                <td class="p-3">畫世代</td>
                <td class="p-3">4/1 – 4/30</td>                <td class="p-3 text-right">12,500,000</td>
                <td class="p-3 text-right font-semibold">375,000</td>
                <td class="p-3 text-center status-cell">
                  <span class="inline-block bg-gray-200 text-gray-700 text-xs px-3 py-1 rounded-full">未送審</span>
                </td>
                <td class="p-3">
                  <div class="flex items-center justify-center gap-1">
                    <button onclick="sendForReview(this)" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-1 rounded text-xs">送審</button>                    <button onclick="showEditCommissionModal()" class="border border-gray-300 text-gray-600 px-3 py-1 rounded text-xs hover:bg-gray-100">編輯</button>
                    <button class="border border-red-300 text-red-500 px-3 py-1 rounded text-xs hover:bg-red-50">刪除</button>
                  </div>
                </td>
              </tr>

              <!-- 列 2：審核中 -->
              <tr class="bg-gray-50 hover:bg-gray-100">
                <td class="p-3">115年3月</td>
                <td class="p-3">TheTop</td>
                <td class="p-3">3/1 – 3/31</td>                <td class="p-3 text-right">8,000,000</td>
                <td class="p-3 text-right font-semibold">200,000</td>
                <td class="p-3 text-center">
                  <span class="inline-block bg-blue-500 text-white text-xs px-3 py-1 rounded-full">審核中</span>
                </td>
                <td class="p-3">
                  <div class="flex items-center justify-center gap-1">
                    <button disabled class="bg-gray-300 text-gray-500 px-3 py-1 rounded text-xs cursor-not-allowed">送審</button>                    <button onclick="showEditCommissionModal()" class="border border-gray-300 text-gray-600 px-3 py-1 rounded text-xs hover:bg-gray-100">編輯</button>
                    <button class="border border-red-300 text-red-500 px-3 py-1 rounded text-xs hover:bg-red-50">刪除</button>
                  </div>
                </td>
              </tr>

              <!-- 列 3：被退回 -->
              <tr class="hover:bg-gray-50">
                <td class="p-3">115年2月</td>
                <td class="p-3">新希望</td>
                <td class="p-3">2/1 – 2/28</td>                <td class="p-3 text-right">5,200,000</td>
                <td class="p-3 text-right font-semibold">156,000</td>
                <td class="p-3 text-center status-cell">
                  <span class="inline-block bg-red-100 text-red-600 text-xs px-3 py-1 rounded-full">被退回</span>
                </td>
                <td class="p-3">
                  <div class="flex items-center justify-center gap-1">
                    <button onclick="sendForReview(this)" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-1 rounded text-xs">送審</button>                    <button onclick="showEditCommissionModal()" class="border border-gray-300 text-gray-600 px-3 py-1 rounded text-xs hover:bg-gray-100">編輯</button>
                    <button class="border border-red-300 text-red-500 px-3 py-1 rounded text-xs hover:bg-red-50">刪除</button>
                  </div>
                </td>
              </tr>

              <!-- 列 4：審核通過 -->
              <tr class="bg-gray-50 hover:bg-gray-100">
                <td class="p-3">115年1月</td>
                <td class="p-3">畫世代</td>
                <td class="p-3">1/1 – 1/31</td>                <td class="p-3 text-right">9,800,000</td>
                <td class="p-3 text-right font-semibold">294,000</td>
                <td class="p-3 text-center">
                  <span class="inline-block bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full">審核通過</span>
                </td>
                <td class="p-3">
                  <div class="flex items-center justify-center gap-1">                    <button onclick="showViewCommissionModal()" class="border border-gray-300 text-gray-600 px-3 py-1 rounded text-xs hover:bg-gray-100">檢視</button>
                    <a href="commission-print.html" target="_blank" class="border border-gray-300 text-gray-600 px-3 py-1 rounded text-xs hover:bg-gray-100">匯出PDF</a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <style>
    /* 送審動畫 */
    @keyframes spin360 { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #d1d5db;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin360 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes slideInRight {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    .toast {
      position: fixed;
      top: 80px; right: 24px;
      z-index: 100000;
      background: #10b981;
      color: #fff;
      padding: 14px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      font-size: 14px;
      display: flex; align-items: center; gap: 10px;
      animation: slideInRight 0.35s ease-out;
    }
    .toast.fade-out { animation: fadeOut 0.4s ease-in forwards; }
    .toast .check {
      width: 22px; height: 22px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: bold;
    }
  </style>

  <script>
    lucide.createIcons();

    // 將各月「可請佣金總金額」存入 localStorage，供媒體執行總表「預估佣金」按週期(建案_年_月)對應讀取
    (function seedCommissionTotals() {
      const demos = [
        { bldg:'畫世代', roc:115, m:'04', total:375000 },
        { bldg:'TheTop', roc:115, m:'03', total:200000 },
        { bldg:'新希望', roc:115, m:'02', total:156000 },
        { bldg:'畫世代', roc:115, m:'01', total:294000 },
        { bldg:'畫世代', roc:115, m:'05', total:450000 }
      ];
      demos.forEach(d => {
        const key = `commission_${d.bldg}_${d.roc + 1911}_${d.m}`;
        if (!localStorage.getItem(key)) localStorage.setItem(key, JSON.stringify({ total: d.total }));
      });
    })();

    // ============================================================
    // 送審互動：點送審 → 確認 → 送出中 → 成功 toast + 更新狀態
    // ============================================================
    function sendForReview(btn) {
      const __tr = btn.closest('tr');
      const __isRejected = __tr && __tr.textContent.includes('被退回');
      const __doSend = () => showConfirm("確定要送出至簽核系統嗎？", "送出後將進入簽核流程，狀態會更新為「審核中」。", () => {
        // 1) 按鈕變「送審中…」
        const originalHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>送審中…';
        btn.classList.remove('bg-gray-700', 'hover:bg-gray-800');
        btn.classList.add('bg-gray-500', 'cursor-not-allowed');

        // 2) 模擬 API 送出
        setTimeout(() => {
          // 3) 成功 toast
          showToast('已送至簽核系統，等待簽核中');

          // 4) 更新該列狀態 badge → 審核中
          const tr = btn.closest('tr');
          const statusCell = tr.querySelector('.status-cell');
          if (statusCell) {
            statusCell.innerHTML = '<span class="inline-block bg-blue-500 text-white text-xs px-3 py-1 rounded-full">審核中</span>';
          }

          // 5) 送審按鈕變 disabled 樣式
          btn.innerHTML = '送審';
          btn.className = 'bg-gray-300 text-gray-500 px-3 py-1 rounded text-xs cursor-not-allowed';
          btn.disabled = true;
        }, 1500);
      });

      // 被退回 → 重送前強制填「異動說明」（向會計交代調整的科目與原因）
      if (__isRejected) {
        showAdjustmentModal(__doSend);
      } else {
        __doSend();
      }
    }

    // 通用確認 modal
    function showConfirm(title, message, onOk) {
      const old = document.getElementById('__confirmDialog__');
      if (old) old.remove();

      const modal = document.createElement('div');
      modal.id = '__confirmDialog__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,0.25);overflow:hidden;">
          <div style="padding:20px 24px 8px;font-weight:bold;font-size:16px;color:#374151;">${title}</div>
          <div style="padding:0 24px 20px;font-size:13px;color:#6b7280;line-height:1.6;">${message}</div>
          <div style="padding:14px 24px;background:#fafafa;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px;">
            <button id="__cfCancel__" style="background:#fff;color:#6b7280;border:1px solid #d1d5db;padding:6px 18px;border-radius:4px;cursor:pointer;font-size:13px;">取消</button>
            <button id="__cfOk__" style="background:#a09080;color:#fff;border:0;padding:6px 18px;border-radius:4px;cursor:pointer;font-size:13px;">確定送出</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      const close = () => modal.remove();
      modal.querySelector('#__cfCancel__').onclick = close;
      modal.querySelector('#__cfOk__').onclick = () => { close(); onOk(); };
      modal.addEventListener('click', e => { if (e.target === modal) close(); });
    }

    // 成功 toast（3 秒自動消失）
    function showToast(message) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span class="check">✓</span><span>${message}</span>`;
      document.body.appendChild(t);
      setTimeout(() => { t.classList.add('fade-out'); }, 2600);
      setTimeout(() => { t.remove(); }, 3000);
    }

    function showAddCommissionModal() {
      // 移除舊彈窗
      const old = document.getElementById('__addCommissionModal__');
      if (old) old.remove();

      const modal = document.createElement('div');
      modal.id = '__addCommissionModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:80px 24px 24px;overflow-y:auto;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";

      const inputStyle = "width:100%;border:1px solid #d1d5db;border-radius:4px;padding:8px 12px;font-size:14px;background:#f9fafb;box-sizing:border-box;";

      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:680px;box-shadow:0 20px 50px rgba(0,0,0,0.25);">
          <!-- 標題列 -->
          <div style="padding:18px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:bold;font-size:16px;color:#374151;">新增佣金表</span>
            <button id="__closeBtn__" style="background:transparent;border:0;cursor:pointer;color:#9ca3af;font-size:20px;line-height:1;padding:4px;">✕</button>
          </div>

          <!-- 表單內容 -->
          <div style="padding:24px;display:flex;flex-direction:column;gap:18px;font-size:14px;">

            <!-- 建案 -->
            <div style="display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:center;">
              <label>建案 <span style="color:#ef4444;">*</span></label>
              <select style="${inputStyle}">
                <option value="">請選擇建案</option>
                <option>畫世代</option>
                <option>TheTop</option>
                <option>新希望</option>
              </select>
            </div>

            <!-- 月份 -->
            <div style="display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:center;">
              <label>月份 <span style="color:#ef4444;">*</span></label>
              <select id="__monthSelect__" style="${inputStyle}">
                <option value="">請選擇月份</option>
                <option>115年1月</option>
                <option>115年2月</option>
                <option>115年3月</option>
                <option>115年4月</option>
                <option>115年5月</option>
                <option>115年6月</option>
                <option>115年7月</option>
                <option>115年8月</option>
                <option>115年9月</option>
                <option>115年10月</option>
                <option>115年11月</option>
                <option>115年12月</option>
              </select>
            </div>

            <!-- 銷售計算期間（依月份自動帶出） -->
            <div style="display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:center;">
              <label>銷售計算期間</label>
              <div style="display:flex;align-items:center;gap:8px;">
                <input id="__periodStart__" type="text" placeholder="自動帶出" readonly style="${inputStyle};color:#374151;">
                <span style="color:#6b7280;">–</span>
                <input id="__periodEnd__" type="text" placeholder="自動帶出" readonly style="${inputStyle};color:#374151;">
              </div>
            </div>

            <!-- 備註 -->
            <div style="display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:start;">
              <label style="padding-top:8px;">備註</label>
              <textarea rows="4" placeholder="請輸入備註" style="${inputStyle};resize:vertical;font-family:inherit;"></textarea>
            </div>
          </div>

          <!-- 底部按鈕 -->
          <div style="padding:16px 24px 24px;display:flex;justify-content:center;gap:12px;">
            <button id="__confirmBtn__" style="background:#a09080;color:#fff;border:0;padding:10px 36px;border-radius:4px;cursor:pointer;font-size:14px;">確定</button>
            <button id="__cancelBtn__" style="background:#ef4444;color:#fff;border:0;padding:10px 36px;border-radius:4px;cursor:pointer;font-size:14px;">取消</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // 關閉行為
      const close = () => modal.remove();
      modal.querySelector('#__closeBtn__').onclick = close;
      modal.querySelector('#__cancelBtn__').onclick = close;
      modal.querySelector('#__confirmBtn__').onclick = () => {
        alert('已新增佣金表（範例）');
        close();
      };
      modal.addEventListener('click', e => { if (e.target === modal) close(); });

      // 月份選擇 → 自動帶出銷售計算期間（民國年 + 月，格式 M/D）
      const monthSel = modal.querySelector('#__monthSelect__');
      const startInput = modal.querySelector('#__periodStart__');
      const endInput = modal.querySelector('#__periodEnd__');
      monthSel.onchange = () => {
        const m = monthSel.value.match(/(\d+)年(\d+)月/);
        if (!m) { startInput.value = ''; endInput.value = ''; return; }
        const rocYear = parseInt(m[1], 10);
        const month = parseInt(m[2], 10);
        const adYear = rocYear + 1911; // 民國轉西元
        const lastDay = new Date(adYear, month, 0).getDate();  // 該月最後一天
        startInput.value = `${month}/1`;
        endInput.value = `${month}/${lastDay}`;
      };
    }

    // ============================================================
    // 編輯佣金表 彈窗
    // ============================================================
    function showEditCommissionModal() {
      const old = document.getElementById('__editCommissionModal__');
      if (old) old.remove();

      const modal = document.createElement('div');
      modal.id = '__editCommissionModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";

      // 樣式變數
      const cellBorder = "border:1px solid #d1d5db;";
      const td = `style="${cellBorder}padding:8px 10px;font-size:13px;"`;
      const tdYellow = `style="${cellBorder}padding:8px 10px;font-size:13px;background:#fffbe6;"`;
      const inputMini = "border:1px solid #d1d5db;padding:3px 6px;width:80px;font-size:13px;border-radius:3px;background:#fff;";
      const inputDate = "border:1px solid #d1d5db;padding:3px 6px;width:50px;font-size:13px;border-radius:3px;background:#fff;text-align:center;";
      const inputAmt  = "border:1px solid #d1d5db;padding:3px 6px;width:60px;font-size:13px;border-radius:3px;background:#fff;text-align:right;";
      const roMini = inputMini + "background:#e5e7eb;color:#6b7280;cursor:not-allowed;";

      // ============================================================
      // 週次資料層（demo；實際應由「銷控表成交資料 × 年度週次設定」帶入）
      //   每週成交總銷（萬）：six=[戶,車]、four=[戶,車]
      //   CUR_WEEK/PREV_WEEK：當週與上一週（實際應依今天日期落在哪一週判定）
      //   編輯時只呈現「當週」與「上一週」；異動針對上一週的修正，結轉至當週認列
      // ============================================================
      const monthLabel = '115年5月';
      const monthRange = '5/04 – 5/31';
      const weekRanges = ['5/04 – 5/10', '5/11 – 5/17', '5/18 – 5/24', '5/25 – 5/31'];
      const CUR_WEEK = 2;            // 當週（demo）
      const PREV_WEEK = CUR_WEEK - 1; // 上一週
      const weekData = [
        { six:[500, 50],  four:[200, 30], recv6:[30, 0], recv4:[0, 0] },
        { six:[800, 100], four:[300, 50], recv6:[40, 0], recv4:[10, 0] },
        { six:[600, 80],  four:[250, 40], recv6:[35, 0], recv4:[8, 0] },
        { six:[300, 20],  four:[350, 10], recv6:[15, 0], recv4:[12, 0] },
      ];
      // 可互動異動（針對上一週的修正：輸入原值/新值，系統自動算差額並結轉至當週）
      const adjList = [
        { target:'6% 戶（A棟12F）', oldVal:0, newVal:1,   reason:'第1週 A棟12F 佣金漏記，核對後補列' },
        { target:'4% 戶（B棟8F）',  oldVal:0, newVal:0.5, reason:'第1週 B棟8F 折讓未入帳，補列' },
      ];

      const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
      const calcWeek = w => {
        const six  = (w.six[0]  + w.six[1])  * 0.06;
        const four = (w.four[0] + w.four[1]) * 0.04;
        return { six, four, sub: six + four };
      };

      // ===== 當週分頁（異動補入為唯讀多筆示意）=====
      function curWeekPane() {
        const c = calcWeek(weekData[CUR_WEEK - 1]);
        const fmtSign = d => (d >= 0 ? '＋' : '－') + fmt(Math.abs(d));
        const totalAdj = adjList.reduce((s, a) => s + (a.newVal - a.oldVal), 0);

          const d = a.newVal - a.oldVal;

      // ===== tab：上一週 / 當週 =====

      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:1000px;box-shadow:0 20px 50px rgba(0,0,0,0.25);">
          <div style="padding:18px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">

            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px 14px;font-size:13px;color:#374151;margin-bottom:14px;">

            <div id="__weekTabs__" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">${tabsHtml}</div>

      // 關閉行為

      // 可互動異動：輸入原值/新值 → 自動算差額 → 結轉更新當週實際
      function bindAdjust() {
        const oldI = paneEl.querySelector('#__adjOld__');
        const newI = paneEl.querySelector('#__adjNew__');
        if (!oldI || !newI) return;
        const diffEl = paneEl.querySelector('#__adjDiff__');
        const diffCell = paneEl.querySelector('#__adjDiffCell__');
        const showEl = paneEl.querySelector('#__adjShow__');
        const realEl = paneEl.querySelector('#__weekReal__');
        const sub = calcWeek(weekData[CUR_WEEK - 1]).sub;
        const upd = () => {
          const d = Number(newI.value || 0) - Number(oldI.value || 0);
          const sign = d >= 0 ? '＋' : '－';
          const txt = sign + fmt(Math.abs(d));
          diffEl.textContent = txt;
          showEl.textContent = txt;
          if (diffCell) diffCell.style.color = d >= 0 ? '#16a34a' : '#dc2626';
          realEl.textContent = fmt(sub + d);
        };
        oldI.addEventListener('input', upd);
        newI.addEventListener('input', upd);
        upd();
      }

      // 已收回佣金（人工填）→ 即時重算未收回 = 可請佣金金額 − 已收回（戶＋車）
      function bindRecv() {

        const upd = () => {
          const h6 = Number((q('.recv-6h') || {}).value || 0), c6 = Number((q('.recv-6c') || {}).value || 0);

          if (u4) u4.textContent = fmt(c.four - (h4 + c4)) + ' 萬';
        };
        ['.recv-6h', '.recv-6c', '.recv-4h', '.recv-4c'].forEach(s => { const el = q(s); if (el) el.addEventListener('input', upd); });
        upd();
      }

      function selectWeek(idx) {
        tabsEl.querySelectorAll('.__wtab').forEach(b => {
          const on = Number(b.dataset.week) === idx;
          b.style.background  = on ? '#a09080' : '#fff';
          b.style.color       = on ? '#fff' : '#6b7280';
          b.style.borderColor = on ? '#a09080' : '#d1d5db';

        if (idx === CUR_WEEK) { paneEl.innerHTML = curWeekPane(); bindAdjust(); bindRecv(); }
        else { paneEl.innerHTML = prevWeekPane(); }

      tabsEl.querySelectorAll('.__wtab').forEach(b => b.addEventListener('click', () => selectWeek(Number(b.dataset.week))));

          total.value = sum;
        };
        modal.querySelectorAll('input[type="number"]').forEach(inp => inp.addEventListener('input', recalc));
      }
    }

                <td ${td} style="${cellBorder}padding:0;">
                  <table style="width:100%;border-collapse:collapse;">

                      <td colspan="2" style="${cellBorder}padding:8px;text-align:center;font-weight:bold;background:#f9fafb;font-size:13px;">請各案場預估「一年」未收回佣金之下款時程</td>

    // ============================================================
    // 異動說明 modal：被退回後重送，強制填「調整科目＋補正期別＋原因」
    // ============================================================
    function showAdjustmentModal(onConfirm) {
      const old = document.getElementById('__adjustModal__');
      if (old) old.remove();
      const modal = document.createElement('div');
      modal.id = '__adjustModal__';
      modal.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;";
      const inputStyle = "width:100%;border:1px solid #d1d5db;border-radius:4px;padding:8px 12px;font-size:14px;background:#f9fafb;box-sizing:border-box;";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:8px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,0.25);">
          <div style="padding:18px 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:8px;">
            <span style="font-weight:bold;font-size:16px;color:#374151;">填寫異動說明後重送</span>
          </div>
          <div style="padding:20px 24px;display:flex;flex-direction:column;gap:16px;font-size:14px;">
            <div style="background:#fef2f2;border-left:3px solid #ef4444;padding:10px 12px;border-radius:4px;font-size:12px;color:#b91c1c;line-height:1.6;">此佣金表曾被退回，重新送審前須向會計說明本次調整了哪些科目與原因，系統將留存異動軌跡。</div>
            <div>
              <label style="display:block;margin-bottom:6px;color:#374151;">調整科目 <span style="color:#ef4444;">*</span></label>
              <select id="__adjTarget__" style="${inputStyle}">
                <option value="">請選擇</option>
                <option>可請佣金 %（趴數）</option>
                <option>已收回佣金</option>
                <option>未收回佣金明細 / 下款時程</option>
                <option>超價部份金額</option>
              </select>
            </div>
            <div>
              <label style="display:block;margin-bottom:6px;color:#374151;">補正期別 <span style="color:#ef4444;">*</span></label>
              <select id="__adjPeriod__" style="${inputStyle}">
                <option value="">請選擇被修正的週次</option>
                <option>開案週（5/01–5/03）</option>
                <option>第1週（5/04–5/10）</option>
                <option>第2週（5/11–5/17）</option>
                <option>第3週（5/18–5/24）</option>
                <option>第4週（5/25–5/31）</option>
              </select>
            </div>
            <div>
              <label style="display:block;margin-bottom:6px;color:#374151;">異動原因 <span style="color:#ef4444;">*</span></label>
              <textarea id="__adjReason__" rows="3" placeholder="例如：客戶議價，主管特批，佣金由 6% 調整為 6.5%" style="${inputStyle};resize:vertical;font-family:inherit;"></textarea>
            </div>
          </div>
          <div style="padding:14px 24px;background:#fafafa;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px;">
            <button id="__adjCancel__" style="background:#fff;color:#6b7280;border:1px solid #d1d5db;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:13px;">取消</button>
            <button id="__adjOk__" style="background:#a09080;color:#fff;border:0;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:13px;">確認並送審</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      const close = () => modal.remove();
      modal.querySelector('#__adjCancel__').onclick = close;
      modal.addEventListener('click', e => { if (e.target === modal) close(); });
      modal.querySelector('#__adjOk__').onclick = () => {
        const target = modal.querySelector('#__adjTarget__').value;
        const period = modal.querySelector('#__adjPeriod__').value;
        const reason = modal.querySelector('#__adjReason__').value.trim();
        if (!target || !period || !reason) {
          alert('請完整填寫「調整科目、補正期別、異動原因」後才能送審。');
          return;
        }
        close();
        onConfirm();
      };
    }
  </script>
