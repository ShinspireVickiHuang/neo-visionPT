<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>週報表編輯 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">
          <a href="weekly-report-list.html" class="hover:text-blue-600">報表管理</a> /
          <a href="weekly-report-list.html" class="hover:text-blue-600">週報表</a> /
          編輯
        </h2>
      </div>

      <!-- 編輯表單卡片 -->
      <div class="bg-white rounded shadow-sm max-w-3xl mx-auto">
        <div class="px-6 py-4 border-b font-bold text-base">編輯</div>

        <div class="px-6 py-5 space-y-5 text-sm">

          <!-- 週期 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>週期 <span class="text-red-500">*</span></label>
            <input type="text" placeholder="週期" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 日期(起) -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>日期(起) <span class="text-red-500">*</span></label>
            <input type="date" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-500">
          </div>

          <!-- 日期(迄) -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>日期(迄) <span class="text-red-500">*</span></label>
            <input type="date" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-500">
          </div>

          <!-- 主委 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>主委 <span class="text-red-500">*</span></label>
            <input type="text" placeholder="主委" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 專案 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>專案 <span class="text-red-500">*</span></label>
            <input type="text" placeholder="專案" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 本週工作重點 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <div>
              <label>本週工作重點 <span class="text-red-500">*</span></label>
              <p class="text-red-500 text-xs mt-1">限制1000字</p>
            </div>
            <textarea rows="5" maxlength="1000" placeholder="本週工作重點"
              class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-vertical w-full"></textarea>
          </div>

          <!-- 下週預計工作計畫 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <div>
              <label>下週預計工作計畫 <span class="text-red-500">*</span></label>
              <p class="text-red-500 text-xs mt-1">限制1000字</p>
            </div>
            <textarea rows="5" maxlength="1000" placeholder="下週預計工作計畫"
              class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-vertical w-full"></textarea>
          </div>

        </div>

        <!-- 底部按鈕 -->
        <div class="flex justify-center gap-3 px-6 py-5 border-t">
          <a href="weekly-report-list.html"
            class="px-6 py-2 rounded border border-gray-300 text-gray-600 hover:bg-gray-50 text-sm">取消</a>
          <a href="weekly-report-view.html"
            class="px-6 py-2 rounded bg-[#5d6b7b] hover:bg-[#4a5563] text-white text-sm">下一步</a>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
