<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>建案編輯 - 銷控系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="content-bg font-sans text-gray-700">

  <header class="bg-white border-b h-16 flex items-center justify-between px-6 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
      <h1 class="text-2xl font-bold tracking-wider text-gray-800">銷控系統</h1>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center border text-xs font-semibold">A</div>
        <span class="text-sm">admin</span>
      </div>
      <button class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-4 py-1.5 rounded text-sm">登出</button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-64px)]">
    <aside id="sidebar" class="w-64 sidebar-bg border-r hidden md:block flex-shrink-0"></aside>

    <main class="flex-1 p-6 overflow-x-hidden">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-gray-700">
          <a href="building-list.html" class="hover:text-blue-600">建案管理</a> /
          <a href="building-list.html" class="hover:text-blue-600">建案管理</a> /
          編輯
        </h2>
      </div>

      <!-- 編輯表單卡片 -->
      <div class="bg-white rounded shadow-sm max-w-3xl mx-auto">
        <div class="px-6 py-4 border-b font-bold text-base">編輯</div>

        <div class="px-6 py-5 space-y-5 text-sm">

          <!-- 建案名稱 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>建案名稱 <span class="text-red-500">*</span></label>
            <input type="text" value="画世代" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 案件編號 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>案件編號 <span class="text-red-500">*</span><span class="text-red-500 text-xs ml-1">限制100字</span></label>
            <input type="text" maxlength="100" value="123asd" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 跑單登入圖片 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <label>
              跑單登入圖片
              <div class="text-red-500 text-xs mt-1">640px*970px</div>
              <a href="#" class="text-blue-500 text-xs underline">下載</a>
            </label>
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 bg-blue-100 border rounded flex-shrink-0"></div>
              <input type="file" class="text-xs">
            </div>
          </div>

          <!-- 跑單首頁圖片 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <label>
              跑單首頁圖片 <span class="text-red-500 text-xs">1600px*400px</span>
              <a href="#" class="block text-blue-500 text-xs underline mt-1">下載</a>
            </label>
            <div class="flex items-center gap-3">
              <div class="w-16 h-8 bg-blue-100 border rounded flex-shrink-0"></div>
              <input type="file" class="text-xs">
            </div>
          </div>

          <!-- 地段 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <label class="pt-2">地段</label>
            <div class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs mb-1 block">縣市 <span class="text-red-500">*</span></label>
                  <select class="w-full border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">請選擇縣市</option>
                    <option>台北市</option><option>新北市</option><option>桃園市</option>
                    <option>台中市</option><option>台南市</option><option>高雄市</option>
                  </select>
                </div>
                <div>
                  <label class="text-xs mb-1 block">鄉鎮 <span class="text-red-500">*</span></label>
                  <select class="w-full border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">請選擇鄉鎮</option>
                  </select>
                </div>
              </div>
              <input type="text" value="台北市信義區信義路125號" class="w-full border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <!-- 棟數 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>棟數</label>
            <span>2</span>
          </div>

          <!-- 代銷公司 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <label class="pt-1">代銷公司</label>
            <span class="leading-relaxed">北區,南區,外島,新理想,元捷整合行銷,聯碩,Unicorn,莉薇</span>
          </div>

          <!-- 相關人員 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>相關人員</label>
            <input type="text" value="李xx陳xx" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- 狀態 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>狀態 <span class="text-red-500">*</span></label>
            <select class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option>已開案</option>
              <option>未開案</option>
              <option>結案</option>
            </select>
          </div>

          <!-- 開案日期 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>開案日期 <span class="text-red-500">*</span></label>
            <input type="date" value="2024-03-08" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- ★ 可請佣金(%) -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>可請佣金(%)</label>
            <div class="flex items-center gap-2">
              <input type="number" min="0" max="100" step="0.01" placeholder="0.00" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-40">
              <span class="text-gray-500 text-xs">%</span>
            </div>
          </div>

          <!-- 客資表單 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>客資表單</label>
            <select class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">請選擇</option>
            </select>
          </div>

          <!-- 來電表單 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>來電表單</label>
            <select class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option>8888-2(22)</option>
            </select>
          </div>

          <!-- Toggle 群組 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>跑單預約資料共享</label>
            <button type="button" class="toggle-switch" onclick="this.classList.toggle('is-on')"></button>
          </div>
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>跑單行事曆共享</label>
            <button type="button" class="toggle-switch" onclick="this.classList.toggle('is-on')"></button>
          </div>
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>跑單銷控表</label>
            <button type="button" class="toggle-switch" onclick="this.classList.toggle('is-on')"></button>
          </div>
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>是否代簽</label>
            <button type="button" class="toggle-switch" onclick="this.classList.toggle('is-on')"></button>
          </div>

          <!-- 開啟業務拆分 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-center">
            <label>開啟業務拆分 <span class="text-red-500">*</span></label>
            <select class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option>關閉</option>
              <option>開啟</option>
            </select>
          </div>

          <!-- 隱私權條款 -->
          <div class="grid grid-cols-[160px_1fr] gap-4 items-start">
            <label class="pt-2">隱私權條款(個資聲明)</label>
            <textarea rows="3" placeholder="null" class="border rounded px-3 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"></textarea>
          </div>

        </div>

        <!-- 底部按鈕 -->
        <div class="px-6 py-4 border-t flex justify-center gap-3 bg-gray-50">
          <button onclick="alert('已儲存（範例）'); location.href='building-list.html'" class="bg-[#a09080] hover:bg-[#8d7d70] text-white px-8 py-2 rounded text-sm">確定</button>
          <a href="building-list.html" class="bg-red-500 hover:bg-red-600 text-white px-8 py-2 rounded text-sm flex items-center">取消</a>
        </div>
      </div>
    </main>
  </div>

  <script>lucide.createIcons();</script>
  <script src="assets/js/sidebar.js"></script>
</body>
</html>
